<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tap Rush Arena 3D</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  overflow: hidden;
  background: #101b2d;
  font-family: Arial, sans-serif;
  color: white;
  touch-action: none;
}

canvas {
  display: block;
}

#hud {
  position: fixed;
  top: 12px;
  left: 12px;
  right: 12px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  pointer-events: none;
  z-index: 5;
}

.panel {
  background: rgba(12, 20, 38, .88);
  border: 2px solid rgba(255,255,255,.15);
  border-radius: 14px;
  padding: 10px 14px;
  box-shadow: 0 5px 20px #0005;
}

#logo {
  font-size: 19px;
  font-weight: 1000;
  font-style: italic;
  letter-spacing: 1px;
  color: #ffe34d;
  text-shadow: 2px 3px #b44c1b;
}

#stats {
  text-align: right;
  font-size: 13px;
  line-height: 1.7;
  font-weight: bold;
}

#healthOuter {
  width: 150px;
  height: 12px;
  margin-top: 5px;
  background: #39232d;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid #fff5;
}

#health {
  height: 100%;
  width: 100%;
  background: #4cff83;
  transition: width .12s;
}

#controls {
  position: fixed;
  bottom: 22px;
  left: 20px;
  right: 20px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  z-index: 10;
  pointer-events: none;
}

#stickArea {
  width: 125px;
  height: 125px;
  position: relative;
  border-radius: 50%;
  background: #142b47bb;
  border: 3px solid #ffffff55;
  pointer-events: auto;
  touch-action: none;
}

#stick {
  position: absolute;
  width: 54px;
  height: 54px;
  left: 32px;
  top: 32px;
  border-radius: 50%;
  background: linear-gradient(145deg, #77e9ff, #1676ed);
  border: 3px solid #ffffffbb;
  box-shadow: 0 5px 15px #0007;
}

#buttons {
  display: flex;
  gap: 13px;
  align-items: flex-end;
  pointer-events: auto;
}

.action {
  border: 3px solid #ffffff99;
  border-radius: 50%;
  color: white;
  font-weight: 1000;
  box-shadow: 0 6px 0 #0005;
  touch-action: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-shadow: 1px 2px #0008;
}

#shoot {
  width: 82px;
  height: 82px;
  background: linear-gradient(145deg, #ff9c39, #e83926);
  font-size: 14px;
}

#super {
  width: 64px;
  height: 64px;
  background: linear-gradient(145deg, #fff45c, #ff9c17);
  color: #502600;
  font-size: 12px;
}

.action:active {
  transform: scale(.92);
}

#message {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 20;
  background: #07111ddd;
  text-align: center;
  padding: 24px;
}

#messageBox {
  max-width: 400px;
  width: 100%;
  background: linear-gradient(145deg, #233e67, #10192d);
  border: 3px solid #ffe34d;
  border-radius: 24px;
  padding: 28px 20px;
  box-shadow: 0 0 50px #248cff44;
}

#message h1 {
  margin: 0 0 10px;
  color: #ffe34d;
  font-size: 34px;
  font-weight: 1000;
  font-style: italic;
}

#message p {
  color: #dce8ff;
  line-height: 1.6;
}

#start {
  border: 0;
  padding: 15px 32px;
  border-radius: 12px;
  color: #19243c;
  background: linear-gradient(90deg, #ffe34d, #ffad32);
  font-size: 18px;
  font-weight: 1000;
  box-shadow: 0 5px 0 #a6531d;
}

#rotate {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 30;
  background: #101b2d;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

@media (orientation: portrait) and (max-width: 800px) {
  #rotate { display: flex; }
}
</style>
</head>

<body>

<div id="hud">
  <div class="panel">
    <div id="logo">TAP RUSH</div>
    <div style="font-size:11px;color:#9cb6dc;margin-top:4px">3D ARENA</div>
    <div id="healthOuter"><div id="health"></div></div>
    <div id="hpText" style="font-size:12px;margin-top:4px">100 HP</div>
  </div>

  <div class="panel" id="stats">
    <div>🏆 ניקוד: <span id="score">0</span></div>
    <div>🤖 יריבים: <span id="remaining">5</span></div>
    <div>⚡ כוח: <span id="charge">0</span>%</div>
  </div>
</div>

<div id="controls">
  <div id="stickArea"><div id="stick"></div></div>
  <div id="buttons">
    <button class="action" id="super">SUPER</button>
    <button class="action" id="shoot">ירי</button>
  </div>
</div>

<div id="message">
  <div id="messageBox">
    <h1>TAP RUSH</h1>
    <div style="color:#8edfff;font-weight:bold;letter-spacing:3px">ARENA 3D</div>
    <p id="description">
      היכנס לזירה!<br>
      הבס את היריבים וצבור נקודות.<br>
      השתמש בג׳ויסטיק כדי לזוז ובכפתור הירי כדי לתקוף.
    </p>
    <button id="start">התחל קרב!</button>
  </div>
</div>

<div id="rotate">📱<br><br>סובב את הטלפון לרוחב<br><br>כדי להיכנס לזירה</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bd8f5);
scene.fog = new THREE.Fog(0x9bd8f5, 24, 55);

const camera = new THREE.PerspectiveCamera(
  48, innerWidth / innerHeight, 0.1, 100
);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: "high-performance"
});

renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.6));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xdaf4ff, 0x536344, 2));

const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.position.set(-8, 16, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);

const mat = (color, roughness = .8, metalness = 0) =>
  new THREE.MeshStandardMaterial({
    color, roughness, metalness
  });

const floorMat = mat(0x64b94d);
const darkGrass = mat(0x55a441);
const wallMat = mat(0x637d91);
const wallTop = mat(0xa7bdc9);
const goldMat = mat(0xffd747, .3, .2);
const bulletMat = mat(0xffdf55, .3);
const blueMat = mat(0x148cff, .35);
const redMat = mat(0xff4c5f, .35);
const whiteMat = mat(0xffffff, .35);
const blackMat = mat(0x172337, .5);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(42, 42), floorMat
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// Decorative arena tiles
for (let x = -20; x <= 20; x += 2) {
  for (let z = -20; z <= 20; z += 2) {
    if ((x + z) % 4 !== 0) continue;

    const tile = new THREE.Mesh(
      new THREE.PlaneGeometry(1.94, 1.94),
      darkGrass
    );
    tile.rotation.x = -Math.PI / 2;
    tile.position.set(x, .012, z);
    scene.add(tile);
  }
}

const obstacles = [];

function box(x, y, z, sx, sy, sz, material, obstacle = false) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(sx, sy, sz), material
  );
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);

  if (obstacle) {
    obstacles.push({
      x, z, hx: sx / 2 + .65, hz: sz / 2 + .65
    });
  }

  return mesh;
}

// Arena boundaries
box(0, 1, -20.5, 42, 2, 1, wallMat, true);
box(0, 1, 20.5, 42, 2, 1, wallMat, true);
box(-20.5, 1, 0, 1, 2, 42, wallMat, true);
box(20.5, 1, 0, 1, 2, 42, wallMat, true);

// Cover and structures
[
  [-7, -6, 3, 2],
  [7, -7, 2, 4],
  [-10, 5, 4, 2],
  [9, 7, 3, 3],
  [0, -10, 5, 1.5],
  [-2, 6, 2, 3],
  [12, 0, 2, 4],
  [-13, -2, 2, 3],
  [5, 2, 3, 2]
].forEach(([x, z, sx, sz], i) => {
  box(x, .75, z, sx, 1.5, sz, wallMat, true);
  box(x, 1.53, z, sx + .12, .12, sz + .12, wallTop);
});

// Small arena decorations
for (let i = 0; i < 18; i++) {
  const x = Math.random() * 34 - 17;
  const z = Math.random() * 34 - 17;

  if (Math.abs(x) < 4 && Math.abs(z) < 4) continue;

  const rock = new THREE.Mesh(
    new THREE.DodecahedronGeometry(.25 + Math.random() * .3, 0),
    mat(0x8b9b75)
  );
  rock.position.set(x, .22, z);
  rock.scale.y = .65;
  rock.castShadow = true;
  scene.add(rock);
}

function makeCharacter(color, enemy = false) {
  const group = new THREE.Group();
  const bodyMat = mat(color, .38);
  const skinMat = mat(enemy ? 0xffc0a1 : 0xffd2a4);
  const darkMat = mat(0x18243b);

  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(.48, .58, .9, 12),
    bodyMat
  );
  body.position.y = .85;
  body.castShadow = true;
  group.add(body);

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(.42, 16, 12),
    skinMat
  );
  head.position.y = 1.48;
  head.castShadow = true;
  group.add(head);

  const helmet = new THREE.Mesh(
    new THREE.SphereGeometry(.44, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2),
    bodyMat
  );
  helmet.position.y = 1.66;
  group.add(helmet);

  // Visor
  const visor = new THREE.Mesh(
    new THREE.BoxGeometry(.52, .16, .15),
    darkMat
  );
  visor.position.set(0, 1.48, .37);
  group.add(visor);

  // Arms
  for (const side of [-1, 1]) {
    const arm = new THREE.Mesh(
      new THREE.CapsuleGeometry(.13, .35, 4, 8),
      bodyMat
    );
    arm.position.set(side * .55, .88, .12);
    arm.rotation.z = side * -.2;
    arm.castShadow = true;
    group.add(arm);
  }

  // Blaster
  const gun = new THREE.Mesh(
    new THREE.BoxGeometry(.2, .2, .72),
    darkMat
  );
  gun.position.set(.28, 1.03, .57);
  group.add(gun);

  const barrel = new THREE.Mesh(
    new THREE.CylinderGeometry(.08, .1, .22, 10),
    goldMat
  );
  barrel.rotation.x = Math.PI / 2;
  barrel.position.set(.28, 1.03, .99);
  group.add(barrel);

  // Feet
  for (const side of [-1, 1]) {
    const foot = new THREE.Mesh(
      new THREE.BoxGeometry(.3, .25, .38),
      darkMat
    );
    foot.position.set(side * .25, .15, .04);
    foot.castShadow = true;
    group.add(foot);
  }

  // Health bar
  const barGroup = new THREE.Group();

  const barBack = new THREE.Mesh(
    new THREE.PlaneGeometry(1.1, .13),
    mat(0x20242b)
  );
  barGroup.add(barBack);

  const barFill = new THREE.Mesh(
    new THREE.PlaneGeometry(1, .08),
    mat(0x53ff7d)
  );
  barFill.position.z = .01;
  barGroup.add(barFill);

  barGroup.position.y = 2.25;
  group.add(barGroup);

  group.userData.healthBar = barGroup;
  group.userData.healthFill = barFill;

  return group;
}

const player = {
  mesh: makeCharacter(0x168cff),
  hp: 100,
  maxHp: 100,
  speed: 6.2,
  alive: true,
  cooldown: 0,
  superCharge: 0
};

scene.add(player.mesh);
player.mesh.position.set(0, 0, 0);

const enemies = [];
const bullets = [];
const effects = [];

function spawnEnemy(x, z) {
  const mesh = makeCharacter(0xff4b59, true);
  mesh.position.set(x, 0, z);
  scene.add(mesh);

  enemies.push({
    mesh,
    hp: 65,
    maxHp: 65,
    speed: 2.2 + Math.random() * .5,
    cooldown: 1 + Math.random(),
    alive: true
  });
}

function spawnWave() {
  for (let i = 0; i < 5; i++) {
    let x, z;

    do {
      x = Math.random() * 28 - 14;
      z = Math.random() * 28 - 14;
    } while (
      Math.hypot(x, z) < 9 ||
      obstacles.some(o =>
        Math.abs(x - o.x) < o.hx + .5 &&
        Math.abs(z - o.z) < o.hz + .5
      )
    );

    spawnEnemy(x, z);
  }
}

let score = 0;
let gameStarted = false;
let gameOver = false;
let shootHeld = false;
let moveX = 0;
let moveZ = 0;
let superHeld = false;

const stickArea = document.getElementById('stickArea');
const stick = document.getElementById('stick');

let stickPointer = null;

function setStick(e) {
  const rect = stickArea.getBoundingClientRect();
  const dx = e.clientX - (rect.left + rect.width / 2);
  const dy = e.clientY - (rect.top + rect.height / 2);
  const max = 34;
  const len = Math.hypot(dx, dy);
  const scale = len > max ? max / len : 1;

  const x = dx * scale;
  const y = dy * scale;

  stick.style.left = (35 + x) + 'px';
  stick.style.top = (35 + y) + 'px';

  moveX = x / max;
  moveZ = y / max;
}

stickArea.addEventListener('pointerdown', e => {
  e.preventDefault();
  stickPointer = e.pointerId;
  stickArea.setPointerCapture(e.pointerId);
  setStick(e);
});

stickArea.addEventListener('pointermove', e => {
  if (e.pointerId === stickPointer) setStick(e);
});

function resetStick() {
  stickPointer = null;
  moveX = 0;
  moveZ = 0;
  stick.style.left = '32px';
  stick.style.top = '32px';
}

stickArea.addEventListener('pointerup', resetStick);
stickArea.addEventListener('pointercancel', resetStick);

const shootButton = document.getElementById('shoot');

shootButton.addEventListener('pointerdown', e => {
  e.preventDefault();
  shootHeld = true;
});

['pointerup', 'pointercancel', 'pointerleave'].forEach(type => {
  shootButton.addEventListener(type, () => shootHeld = false);
});

document.getElementById('super').addEventListener('pointerdown', e => {
  e.preventDefault();
  superHeld = true;
});

document.getElementById('super').addEventListener('pointerup', () => superHeld = false);
document.getElementById('super').addEventListener('pointercancel', () => superHeld = false);

function blocked(x, z) {
  if (Math.abs(x) > 18.3 || Math.abs(z) > 18.3) return true;

  return obstacles.some(o =>
    Math.abs(x - o.x) < o.hx &&
    Math.abs(z - o.z) < o.hz
  );
}

function makeBullet(from, target, enemyBullet = false) {
  const material = enemyBullet ? redMat : bulletMat;

  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(enemyBullet ? .16 : .19, 12, 10),
    material
  );

  mesh.position.set(
    from.position.x,
    1.05,
    from.position.z
  );

  scene.add(mesh);

  const dx = target.x - from.position.x;
  const dz = target.z - from.position.z;
  const length = Math.hypot(dx, dz) || 1;

  bullets.push({
    mesh,
    vx: dx / length * 15,
    vz: dz / length * 15,
    enemyBullet,
    life: 2,
    damage: enemyBullet ? 9 : 25
  });
}

function nearestEnemy() {
  let best = null;
  let dist = Infinity;

  for (const e of enemies) {
    if (!e.alive) continue;

    const d = Math.hypot(
      e.mesh.position.x - player.mesh.position.x,
      e.mesh.position.z - player.mesh.position.z
    );

    if (d < dist) {
      dist = d;
      best = e;
    }
  }

  return best;
}

function updateHealthBar(character, hp, maxHp) {
  character.userData.healthFill.scale.x =
    Math.max(0, hp / maxHp);

  character.userData.healthFill.position.x =
    -(1 - hp / maxHp) * .5;
}

function damagePlayer(amount) {
  player.hp = Math.max(0, player.hp - amount);

  document.getElementById('health').style.width =
    player.hp + '%';

  document.getElementById('hpText').textContent =
    player.hp + ' HP';

  if (player.hp <= 0) finishGame(false);
}

function burst(position, color = 0xffd747) {
  for (let i = 0; i < 9; i++) {
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(.09, 8, 8),
      mat(color, .4)
    );

    mesh.position.copy(position);
    scene.add(mesh);

    effects.push({
      mesh,
      vx: (Math.random() - .5) * 7,
      vy: Math.random() * 5,
      vz: (Math.random() - .5) * 7,
      life: .5 + Math.random() * .5
    });
  }
}

function useSuper() {
  if (player.superCharge < 100) return;

  player.superCharge = 0;
  const center = player.mesh.position;

  burst(new THREE.Vector3(center.x, 1, center.z), 0x53cfff);

  for (const e of enemies) {
    if (!e.alive) continue;

    const dx = e.mesh.position.x - center.x;
    const dz = e.mesh.position.z - center.z;

    if (Math.hypot(dx, dz) < 7) {
      e.hp -= 65;

      if (e.hp <= 0) {
        e.alive = false;
        scene.remove(e.mesh);
        score += 2;
        burst(e.mesh.position.clone(), 0xff6a56);
      } else {
        updateHealthBar(e.mesh, e.hp, e.maxHp);
      }
    }
  }

  updateHUD();
}

function updateHUD() {
  document.getElementById('score').textContent = score;
  document.getElementById('remaining').textContent =
    enemies.filter(e => e.alive).length;

  document.getElementById('charge').textContent =
    Math.floor(player.superCharge);
}

function finishGame(won) {
  if (gameOver) return;
  gameOver = true;

  document.getElementById('message').style.display = 'flex';
  document.getElementById('message').querySelector('h1').textContent =
    won ? 'VICTORY!' : 'GAME OVER';

  document.getElementById('description').innerHTML =
    (won ? '🏆 ניצחת בזירה!' : 'הקרב הסתיים!') +
    '<br>ניקוד סופי: ' + score +
    '<br>נסה שוב ושבור את השיא!';

  document.getElementById('start').textContent = 'שחק שוב';
}

function startGame() {
  enemies.forEach(e => scene.remove(e.mesh));
  bullets.forEach(b => scene.remove(b.mesh));
  effects.forEach(e => scene.remove(e.mesh));

  enemies.length = 0;
  bullets.length = 0;
  effects.length = 0;

  score = 0;
  player.hp = 100;
  player.superCharge = 0;
  player.alive = true;
  player.cooldown = 0;

  player.mesh.position.set(0, 0, 0);
  player.mesh.rotation.set(0, 0, 0);

  gameOver = false;
  gameStarted = true;

  document.getElementById('health').style.width = '100%';
  document.getElementById('hpText').textContent = '100 HP';
  document.getElementById('message').style.display = 'none';

  spawnWave();
  updateHUD();
}

document.getElementById('start').addEventListener('click', startGame);

const clock = new THREE.Clock();

function update(dt) {
  if (!gameStarted || gameOver) return;

  player.cooldown -= dt;

  // Player movement
  const len = Math.hypot(moveX, moveZ);

  if (len > .08) {
    const dx = moveX / Math.max(1, len);
    const dz = moveZ / Math.max(1, len);

    const nx = player.mesh.position.x + dx * player.speed * dt;
    const nz = player.mesh.position.z + dz * player.speed * dt;

    if (!blocked(nx, player.mesh.position.z))
      player.mesh.position.x = nx;

    if (!blocked(player.mesh.position.x, nz))
      player.mesh.position.z = nz;

    player.mesh.rotation.y = Math.atan2(dx, dz);
  }

  // Aim and fire
  const target = nearestEnemy();

  if (target) {
    const dx = target.mesh.position.x - player.mesh.position.x;
    const dz = target.mesh.position.z - player.mesh.position.z;

    player.mesh.rotation.y = Math.atan2(dx, dz);

    if (shootHeld && player.cooldown <= 0) {
      makeBullet(player.mesh, target.mesh.position);
      player.cooldown = .32;
    }
  }

  if (superHeld) {
    useSuper();
    superHeld = false;
  }

  // Enemies chase and attack
  for (const e of enemies) {
    if (!e.alive) continue;

    e.cooldown -= dt;

    const dx = player.mesh.position.x - e.mesh.position.x;
    const dz = player.mesh.position.z - e.mesh.position.z;
    const dist = Math.hypot(dx, dz) || 1;

    e.mesh.rotation.y = Math.atan2(dx, dz);

    if (dist > 5) {
      const nx = e.mesh.position.x + dx / dist * e.speed * dt;
      const nz = e.mesh.position.z + dz / dist * e.speed * dt;

      if (!blocked(nx, e.mesh.position.z))
        e.mesh.position.x = nx;

      if (!blocked(e.mesh.position.x, nz))
        e.mesh.position.z = nz;
    } else if (e.cooldown <= 0) {
      makeBullet(e.mesh, player.mesh.position, true);
      e.cooldown = 1.4 + Math.random() * .5;
    }
  }

  // Bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];

    b.mesh.position.x += b.vx * dt;
    b.mesh.position.z += b.vz * dt;
    b.life -= dt;

    let remove = b.life <= 0 ||
      blocked(b.mesh.position.x, b.mesh.position.z);

    if (!remove && b.enemyBullet) {
      const d = Math.hypot(
        b.mesh.position.x - player.mesh.position.x,
        b.mesh.position.z - player.mesh.position.z
      );

      if (d < .8) {
        damagePlayer(b.damage);
        remove = true;
      }
    } else if (!remove) {
      for (const e of enemies) {
        if (!e.alive) continue;

        const d = Math.hypot(
          b.mesh.position.x - e.mesh.position.x,
          b.mesh.position.z - e.mesh.position.z
        );

        if (d < .85) {
          e.hp -= b.damage;
          player.superCharge = Math.min(100, player.superCharge + 12);
          updateHealthBar(e.mesh, e.hp, e.maxHp);
          burst(b.mesh.position.clone(), 0xffdf55);
          remove = true;

          if (e.hp <= 0) {
            e.alive = false;
            scene.remove(e.mesh);
            score += 1;
            player.superCharge = Math.min(100, player.superCharge + 10);
          }

          break;
        }
      }
    }

    if (remove) {
      scene.remove(b.mesh);
      bullets.splice(i, 1);
    }
  }

  // Visual effects
  for (let i = effects.length - 1; i >= 0; i--) {
    const p = effects[i];

    p.life -= dt;
    p.mesh.position.x += p.vx * dt;
    p.mesh.position.y += p.vy * dt;
    p.mesh.position.z += p.vz * dt;
    p.vy -= 9 * dt;
    p.mesh.scale.multiplyScalar(.97);

    if (p.life <= 0) {
      scene.remove(p.mesh);
      effects.splice(i, 1);
    }
  }

  // Follow camera
  const px = player.mesh.position.x;
  const pz = player.mesh.position.z;

  camera.position.lerp(
    new THREE.Vector3(px, 18, pz + 13),
    Math.min(1, dt * 3)
  );

  camera.lookAt(px, 0, pz);

  updateHUD();

  if (enemies.every(e => !e.alive)) {
    finishGame(true);
  }
}

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), .035);

  update(dt);
  renderer.render(scene, camera);
}

animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
