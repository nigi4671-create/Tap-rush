<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tap Rush Arena</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101426;color:white;font-family:Arial,sans-serif;text-align:center;overflow:hidden;touch-action:none}
#game{display:block;width:100vw;height:100dvh;background:#243d36}
#hud{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:space-around;align-items:center;pointer-events:none;font-weight:bold;text-shadow:0 2px 4px #000}
.badge{background:#111c;padding:9px 13px;border:1px solid #ffffff44;border-radius:12px}
#healthBox{width:100px;height:12px;background:#541d2c;border-radius:10px;overflow:hidden;margin-top:5px}
#health{height:100%;width:100%;background:#49ed79;transition:width .15s}
#controls{position:absolute;bottom:24px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 22px}
#stick{width:115px;height:115px;border-radius:50%;background:#ffffff22;border:3px solid #ffffff55;position:relative;touch-action:none}
#knob{position:absolute;left:30px;top:30px;width:49px;height:49px;border-radius:50%;background:#ffffff99;border:2px solid white}
.action{width:76px;height:76px;border-radius:50%;border:4px solid #ffffff99;color:white;font-size:25px;font-weight:bold;box-shadow:0 5px #0005;touch-action:none}
#shoot{background:#ec4b54}
#super{background:#9a54f5;width:65px;height:65px;font-size:14px}
#actions{display:flex;align-items:end;gap:12px}
#overlay{position:absolute;inset:0;background:#0a1024dd;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:24px}
#overlay h1{font-size:42px;color:#ffdf55;margin:0 0 10px;text-shadow:0 4px #a54a22}
#overlay p{max-width:300px;line-height:1.6}
#start{border:0;border-radius:14px;padding:15px 32px;background:#54e58b;color:#10251b;font-size:20px;font-weight:bold}
.small{font-size:12px;color:#c9d1e8}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="badge">🏆 <span id="score">0</span></div>
  <div class="badge">❤️ <span id="hpText">100</span><div id="healthBox"><div id="health"></div></div></div>
  <div class="badge">⚡ <span id="superText">מוכן</span></div>
</div>

<div id="controls">
  <div id="stick"><div id="knob"></div></div>
  <div id="actions">
    <button class="action" id="super">SUPER</button>
    <button class="action" id="shoot">➤</button>
  </div>
</div>

<div id="overlay">
  <h1>TAP RUSH</h1>
  <h2>⚔️ ARENA BRAWL ⚔️</h2>
  <p>היכנס לזירה, התחמק מאויבים, ירה בהם וצבור נקודות. שרוד כמה שיותר!</p>
  <button id="start">🔥 התחל קרב</button>
  <p class="small">תנועה: הג'ויסטיק · ירי: הכפתור האדום · מתקפה מיוחדת: SUPER</p>
</div>

<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
let W=0,H=0,active=false,score=0,last=0,spawn=0;
let player, enemies=[],bullets=[],particles=[];
let move={x:0,y:0},shooting=false,superReady=true;
const rnd=(a,b)=>Math.random()*(b-a)+a;
function resize(){
  W=canvas.width=innerWidth*devicePixelRatio;
  H=canvas.height=innerHeight*devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  W=innerWidth;H=innerHeight;
}
addEventListener('resize',resize);resize();

function reset(){
 player={x:W/2,y:H/2,r:17,hp:100,speed:205,inv:0};
 enemies=[];bullets=[];particles=[];score=0;spawn=0;
 superReady=true;active=true;last=performance.now();
 $('score').textContent=0;
 $('overlay').style.display='none';
 requestAnimationFrame(loop);
}
function enemy(){
 let side=Math.floor(Math.random()*4),x,y;
 if(side===0){x=rnd(20,W-20);y=40}
 if(side===1){x=W-30;y=rnd(70,H-40)}
 if(side===2){x=rnd(20,W-20);y=H-130}
 if(side===3){x=30;y=rnd(70,H-40)}
 enemies.push({x,y,r:15,hp:2,speed:rnd(48,75),hit:0});
}
function shoot(){
 if(!active)return;
 let target=null,best=Infinity;
 for(const e of enemies){
  const d=Math.hypot(e.x-player.x,e.y-player.y);
  if(d<best){best=d;target=e}
 }
 let dx=target?target.x-player.x:move.x||1;
 let dy=target?target.y-player.y:move.y;
 let len=Math.hypot(dx,dy)||1;
 bullets.push({x:player.x,y:player.y,vx:dx/len*430,vy:dy/len*430,r:6,life:1.1});
}
function burst(x,y,color,n=10){
 for(let i=0;i<n;i++){
  const a=rnd(0,Math.PI*2),s=rnd(40,180);
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.2,.55),color});
 }
}
function special(){
 if(!active||!superReady)return;
 superReady=false;$('superText').textContent='נטען';
 for(const e of enemies){
  const d=Math.hypot(e.x-player.x,e.y-player.y);
  if(d<155){e.hp-=3;burst(e.x,e.y,'#b77aff',14)}
 }
 burst(player.x,player.y,'#c18cff',35);
 setTimeout(()=>{superReady=true;$('superText').textContent='מוכן'},5000);
}
function circle(x,y,r,color,stroke){
 ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
 if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=3;ctx.stroke()}
}
function loop(now){
 if(!active)return;
 const dt=Math.min((now-last)/1000,.04);last=now;
 ctx.clearRect(0,0,W,H);
 // זירה
 ctx.fillStyle='#284b3d';ctx.fillRect(0,0,W,H);
 const tile=42;
 for(let x=0;x<W;x+=tile)for(let y=0;y<H;y+=tile){
  if((Math.floor(x/tile)+Math.floor(y/tile))%2===0){
   ctx.fillStyle='#ffffff08';ctx.fillRect(x,y,tile,tile);
  }
 }
 // מכשולים דקורטיביים
 for(let x=40;x<W;x+=120)for(let y=100;y<H-140;y+=145){
  ctx.fillStyle='#182c2c';ctx.fillRect(x,y,36,30);
  ctx.fillStyle='#477d48';ctx.fillRect(x+3,y+3,30,24);
 }
 // שחקן
 player.x=Math.max(20,Math.min(W-20,player.x+move.x*player.speed*dt));
 player.y=Math.max(65,Math.min(H-145,player.y+move.y*player.speed*dt));
 player.inv=Math.max(0,player.inv-dt);
 if(shooting)spawn-=dt;
 if(shooting&&spawn<=0){shoot();spawn=.24}
 // אויבים
 if(Math.random()<dt*(.55+score/45)&&enemies.length<9)enemy();
 for(const e of enemies){
  const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;
  e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt;
  if(d<e.r+player.r&&player.inv<=0){
   player.hp-=12;player.inv=.65;burst(player.x,player.y,'#ff6374',7);
  }
  circle(e.x,e.y,e.r,'#ee5260','#ffb2a9');
  circle(e.x-4,e.y-3,3,'#fff');
  ctx.fillStyle='#411d32';ctx.fillRect(e.x-15,e.y-24,30,4);
  ctx.fillStyle='#ffcc4a';ctx.fillRect(e.x-15,e.y-24,30*Math.max(0,e.hp/2),4);
 }
 enemies=enemies.filter(e=>{
  if(e.hp<=0){score++;$('score').textContent=score;burst(e.x,e.y,'#ffd45e',12);return false}
  return true;
 });
 // כדורים
 for(const b of bullets){
  b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
  circle(b.x,b.y,b.r,'#ffe17b');
  for(const e of enemies){
   if(Math.hypot(b.x-e.x,b.y-e.y)<b.r+e.r){
    e.hp--;b.life=0;burst(b.x,b.y,'#ffe17b',4);break;
   }
  }
 }
 bullets=bullets.filter(b=>b.life>0&&b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);
 // חלקיקים
 for(const p of particles){
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
  circle(p.x,p.y,Math.max(1,p.life*6),p.color);
 }
 particles=particles.filter(p=>p.life>0);
 if(player.inv<=0||Math.floor(now/80)%2===0){
  circle(player.x,player.y,player.r,'#4fdcff','#d8faff');
  circle(player.x+4,player.y-4,5,'#fff');
  circle(player.x+7,player.y-4,2,'#17233e');
 }
 $('hpText').textContent=Math.max(0,Math.ceil(player.hp));
 $('health').style.width=Math.max(0,player.hp)+'%';
 if(player.hp<=0){endGame();return}
 requestAnimationFrame(loop);
}
function endGame(){
 active=false;
 $('overlay').style.display='flex';
 $('overlay').innerHTML=`<h1>הקרב נגמר!</h1><h2>🏆 ניקוד: ${score}</h2><p>נסה שוב ושבור את השיא שלך!</p><button id="start">🔁 קרב נוסף</button>`;
 $('start').addEventListener('click',reset);
}
$('start').addEventListener('click',reset);
$('shoot').addEventListener('pointerdown',e=>{e.preventDefault();shooting=true;shoot()});
['pointerup','pointercancel','pointerleave'].forEach(ev=>$('shoot').addEventListener(ev,()=>shooting=false));
$('super').addEventListener('pointerdown',e=>{e.preventDefault();special()});

// ג'ויסטיק וירטואלי
const stick=$('stick'),knob=$('knob');let pointer=null;
function joy(e){
 const r=stick.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
 const max=37,len=Math.hypot(dx,dy)||1;
 if(len>max){dx=dx/len*max;dy=dy/len*max}
 move={x:dx/max,y:dy/max};
 knob.style.transform=`translate(${dx}px,${dy}px)`;
}
stick.addEventListener('pointerdown',e=>{pointer=e.pointerId;stick.setPointerCapture(pointer);joy(e)});
stick.addEventListener('pointermove',e=>{if(e.pointerId===pointer)joy(e)});
function stopJoy(){pointer=null;move={x:0,y:0};knob.style.transform='translate(0,0)'}
stick.addEventListener('pointerup',stopJoy);
stick.addEventListener('pointercancel',stopJoy);

// מקלדת למחשב
const keys={};
addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key===' ')shoot();
 if(e.key.toLowerCase()==='e')special();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function keyboardLoop(){
 if(active){
  let x=0,y=0;
  if(keys.w||keys.arrowup)y--;
  if(keys.s||keys.arrowdown)y++;
  if(keys.a||keys.arrowleft)x--;
  if(keys.d||keys.arrowright)x++;
  if(x||y){const d=Math.hypot(x,y);move={x:x/d,y:y/d}}
  else if(!pointer)move={x:0,y:0};
 }
 requestAnimationFrame(keyboardLoop);
}
keyboardLoop();
</script>
</body>
</html>
