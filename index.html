<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#10141e">
<title>TAP RUSH ARENA</title>
<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #10141e;
  color: white;
  font-family: Arial, sans-serif;
  user-select: none;
}
#game {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
#hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
}
.top {
  position: absolute;
  top: max(10px, env(safe-area-inset-top));
  left: max(12px, env(safe-area-inset-left));
  right: max(12px, env(safe-area-inset-right));
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.panel {
  padding: 8px 13px;
  border: 1px solid #ffffff35;
  background: #101a2ddd;
  border-radius: 10px;
  font-weight: bold;
  font-size: clamp(12px, 2.5vw, 17px);
  box-shadow: 0 3px 12px #0004;
}
#healthBox {
  position: absolute;
  left: max(12px, env(safe-area-inset-left));
  top: 58px;
  width: 150px;
}
.bar {
  width: 100%;
  height: 9px;
  background: #421e2b;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 6px;
}
#health {
  height: 100%;
  width: 100%;
  background: #42f28b;
  transition: width .15s;
}
#controls {
  position: absolute;
  bottom: max(15px, env(safe-area-inset-bottom));
  left: max(18px, env(safe-area-inset-left));
  right: max(18px, env(safe-area-inset-right));
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
}
button {
  color: white;
  border: 2px solid #ffffff50;
  background: #263e5c;
  font-weight: bold;
  box-shadow: 0 4px 0 #101a28;
  user-select: none;
}
#move {
  display: grid;
  grid-template-columns: repeat(3, 43px);
  gap: 4px;
}
#move button {
  width: 43px;
  height: 40px;
  border-radius: 11px;
  font-size: 17px;
}
.empty {
  visibility: hidden;
}
#attack {
  width: clamp(72px, 14vw, 100px);
  height: clamp(72px, 14vw, 100px);
  border-radius: 50%;
  background: linear-gradient(145deg, #ff7160, #d92738);
  border: 4px solid #ffc0a7;
  font-size: clamp(12px, 2.6vw, 17px);
  box-shadow: 0 0 25px #ff3f4d50, 0 5px 0 #721a28;
}
#overlay {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #080c16eF;
  z-index: 10;
  padding: 12px;
}
.card {
  width: min(90%, 380px);
  max-height: 90%;
  overflow: auto;
  text-align: center;
  padding: 22px;
  border-radius: 22px;
  background: linear-gradient(145deg, #243d61, #121b2b);
  border: 2px solid #70c8ff80;
  box-shadow: 0 0 45px #188aff30;
}
h1 {
  font-size: clamp(28px, 5vw, 40px);
  margin: 0 0 5px;
  color: #7de0ff;
  text-shadow: 0 0 20px #168dff;
}
h2 {
  margin: 5px 0 15px;
}
#hint {
  color: #c1d2e6;
  line-height: 1.5;
  font-size: 14px;
}
#start {
  width: 100%;
  margin-top: 12px;
  padding: 14px;
  border-radius: 12px;
  background: linear-gradient(90deg, #168cff, #4a65ff);
  font-size: 19px;
}
#rotateMessage {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 20;
  background: #10141e;
  color: white;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 25px;
  font-size: 22px;
  font-weight: bold;
  font-family: Arial, sans-serif;
}
@media (orientation: portrait) {
  #rotateMessage {
    display: flex;
  }
}
@media (orientation: landscape) {
  #rotateMessage {
    display: none;
  }
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="top">
    <div class="panel">TAP RUSH ARENA</div>
    <div class="panel">ניקוד: <span id="score">0</span></div>
  </div>
  <div id="healthBox" class="panel">
    <div>בריאות</div>
    <div class="bar"><div id="health"></div></div>
    <div style="margin-top:5px">ניצחונות: <span id="wins">0</span></div>
  </div>
  <div id="controls">
    <div id="move">
      <button class="empty"></button>
      <button data-move="up">▲</button>
      <button class="empty"></button>
      <button data-move="left">◀</button>
      <button data-move="down">▼</button>
      <button data-move="right">▶</button>
    </div>
    <button id="attack">ATTACK</button>
  </div>
</div>
<div id="rotateMessage">
  יש לסובב את האייפון לרוחב כדי לשחק
</div>
<div id="overlay">
  <div class="card">
    <h1>TAP RUSH</h1>
    <h2>ARENA</h2>
    <p id="hint">
      היכנס לזירה, התחמק מהיריבים והשתלט על הקרב.
      <br><br>
      השתמש בחצים כדי לזוז ובכפתור ATTACK כדי לתקוף.
    </p>
    <button id="start">התחל משחק</button>
  </div>
</div>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => {
  setTimeout(resize, 200);
});
resize();
const player = {
  x: 0, y: 0, r: 18,
  hp: 100, speed: 3.2,
  cooldown: 0, invulnerable: 0
};
let enemies = [];
let bullets = [];
let particles = [];
let score = 0;
let wins = 0;
let running = false;
let lastTime = 0;
let spawnTimer = 0;
let keys = {};
let attackHeld = false;
let arenaTime = 0;
let animationId = null;
const scoreEl = document.getElementById("score");
const healthEl = document.getElementById("health");
const winsEl = document.getElementById("wins");
const overlay = document.getElementById("overlay");
document.getElementById("start").addEventListener("click", () => {
  // בקשת מסך מלא היא אופציונלית, ותלויה בדפדפן.
  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(() => {});
  }
  resetGame();
});
function resetGame() {
  resize();
  player.x = W / 2;
  player.y = H / 2;
  player.hp = 100;
  player.cooldown = 0;
  player.invulnerable = 0;
  enemies = [];
  bullets = [];
  particles = [];
  score = 0;
  spawnTimer = 0;
  arenaTime = 0;
  keys = {};
  attackHeld = false;
  for (let i = 0; i < 4; i++) spawnEnemy();
  scoreEl.textContent = score;
  healthEl.style.width = "100%";
  document.querySelector("#overlay h1").textContent = "TAP RUSH";
  document.querySelector("#overlay h2").textContent = "ARENA";
  document.getElementById("hint").innerHTML =
    "היכנס לזירה, התחמק מהיריבים והשתלט על הקרב." +
    "<br><br>השתמש בחצים כדי לזוז ובכפתור ATTACK כדי לתקוף.";
  document.getElementById("start").textContent = "התחל משחק";
  overlay.style.display = "none";
  running = true;
  lastTime = performance.now();
  if (animationId) cancelAnimationFrame(animationId);
  animationId = requestAnimationFrame(loop);
}
function spawnEnemy() {
  const side = Math.floor(Math.random() * 4);
  let x, y;
  if (side === 0) { x = Math.random() * W; y = 65; }
  if (side === 1) { x = W - 30; y = Math.random() * H; }
  if (side === 2) { x = Math.random() * W; y = H - 40; }
  if (side === 3) { x = 30; y = Math.random() * H; }
  enemies.push({
    x, y, r: 17,
    hp: 2,
    speed: 0.8 + Math.random() * 0.4,
    attackTimer: 0,
    color: ["#ff514f", "#ff9f43", "#d65cff"][
      Math.floor(Math.random() * 3)
    ]
  });
}
function particleBurst(x, y, color, amount = 10) {
  for (let i = 0; i < amount; i++) {
    const a = Math.random() * Math.PI * 2;
    const speed = Math.random() * 4 + 1;
    particles.push({
      x, y,
      vx: Math.cos(a) * speed,
      vy: Math.sin(a) * speed,
      life: 25 + Math.random() * 20,
      color
    });
  }
}
function attack() {
  if (!running || player.cooldown > 0) return;
  player.cooldown = 17;
  let target = null;
  let best = 220;
  for (const e of enemies) {
    const d = Math.hypot(e.x - player.x, e.y - player.y);
    if (d < best) {
      best = d;
      target = e;
    }
  }
  if (target) {
    const dx = target.x - player.x;
    const dy = target.y - player.y;
    const len = Math.hypot(dx, dy) || 1;
    bullets.push({
      x: player.x,
      y: player.y,
      vx: dx / len * 8,
      vy: dy / len * 8,
      life: 35,
      damage: 1
    });
  } else {
    particleBurst(player.x, player.y, "#66ddff", 5);
  }
}
document.getElementById("attack").addEventListener("pointerdown", e => {
  e.preventDefault();
  attackHeld = true;
  attack();
});
document.getElementById("attack").addEventListener("pointerup", () => {
  attackHeld = false;
});
document.getElementById("attack").addEventListener("pointercancel", () => {
  attackHeld = false;
});
document.querySelectorAll("[data-move]").forEach(button => {
  const key = button.dataset.move;
  button.addEventListener("pointerdown", e => {
    e.preventDefault();
    keys[key] = true;
    button.setPointerCapture(e.pointerId);
  });
  const stop = () => keys[key] = false;
  button.addEventListener("pointerup", stop);
  button.addEventListener("pointercancel", stop);
  button.addEventListener("lostpointercapture", stop);
});
window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (["arrowup", "w"].includes(k)) keys.up = true;
  if (["arrowdown", "s"].includes(k)) keys.down = true;
  if (["arrowleft", "a"].includes(k)) keys.left = true;
  if (["arrowright", "d"].includes(k)) keys.right = true;
  if (k === " ") attack();
});
window.addEventListener("keyup", e => {
  const k = e.key.toLowerCase();
  if (["arrowup", "w"].includes(k)) keys.up = false;
  if (["arrowdown", "s"].includes(k)) keys.down = false;
  if (["arrowleft", "a"].includes(k)) keys.left = false;
  if (["arrowright", "d"].includes(k)) keys.right = false;
});
function drawArena() {
  ctx.fillStyle = "#263e35";
  ctx.fillRect(0, 0, W, H);
  const tile = 42;
  for (let y = 0; y < H; y += tile) {
    for (let x = 0; x < W; x += tile) {
      ctx.fillStyle =
        ((x / tile + y / tile) % 2 === 0)
          ? "#2b493d" : "#304e41";
      ctx.fillRect(x, y, tile - 1, tile - 1);
    }
  }
  ctx.strokeStyle = "#91c9a533";
  ctx.lineWidth = 3;
  ctx.strokeRect(12, 12, W - 24, H - 24);
  const obstacles = [
    [W * 0.22, H * 0.30, 65, 45],
    [W * 0.68, H * 0.25, 58, 55],
    [W * 0.27, H * 0.65, 55, 58],
    [W * 0.72, H * 0.65, 68, 45]
  ];
  for (const [x, y, w, h] of obstacles) {
    ctx.fillStyle = "#182b27";
    ctx.fillRect(x + 5, y + 7, w, h);
    ctx.fillStyle = "#697b55";
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = "#84986b";
    ctx.fillRect(x + 5, y + 5, w - 10, 8);
    ctx.strokeStyle = "#182b27";
    ctx.lineWidth = 3;
    ctx.strokeRect(x, y, w, h);
  }
}
function drawCharacter(x, y, r, color, isPlayer = false) {
  ctx.save();
  ctx.fillStyle = "#0005";
  ctx.beginPath();
  ctx.ellipse(x + 3, y + 7, r * 1.1, r * 0.75, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = isPlayer ? "#b7f1ff" : "#ffd3d3";
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(x - 6, y - 3, 4, 0, Math.PI * 2);
  ctx.arc(x + 6, y - 3, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#18212c";
  ctx.beginPath();
  ctx.arc(x - 5, y - 3, 2, 0, Math.PI * 2);
  ctx.arc(x + 7, y - 3, 2, 0, Math.PI * 2);
  ctx.fill();
  if (isPlayer) {
    ctx.fillStyle = "#c8f7ff";
    ctx.fillRect(x - 12, y + 11, 24, 5);
  }
  ctx.restore();
}
function loop(now) {
  if (!running) return;
  const dt = Math.min((now - lastTime) / 16.67, 2);
  lastTime = now;
  update(dt);
  draw();
  if (running) animationId = requestAnimationFrame(loop);
}
function update(dt) {
  if (player.cooldown > 0) player.cooldown -= dt;
  if (player.invulnerable > 0) player.invulnerable -= dt;
  let dx = 0, dy = 0;
  if (keys.left) dx--;
  if (keys.right) dx++;
  if (keys.up) dy--;
  if (keys.down) dy++;
  const len = Math.hypot(dx, dy) || 1;
  player.x += dx / len * player.speed * dt;
  player.y += dy / len * player.speed * dt;
  player.x = Math.max(30, Math.min(W - 30, player.x));
  player.y = Math.max(65, Math.min(H - 30, player.y));
  if (attackHeld && player.cooldown <= 0) attack();
  spawnTimer += dt;
  if (spawnTimer > 100 && enemies.length < 10) {
    spawnEnemy();
    spawnTimer = 0;
  }
  for (const e of enemies) {
    const ex = player.x - e.x;
    const ey = player.y - e.y;
    const d = Math.hypot(ex, ey) || 1;
    e.x += ex / d * e.speed * dt;
    e.y += ey / d * e.speed * dt;
    e.attackTimer -= dt;
    if (d < e.r + player.r && e.attackTimer <= 0) {
      if (player.invulnerable <= 0) {
        player.hp -= 10;
        player.invulnerable = 28;
        particleBurst(player.x, player.y, "#ff5353", 9);
        healthEl.style.width = Math.max(0, player.hp) + "%";
      }
      e.attackTimer = 30;
    }
  }
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;
    let remove =
      b.life <= 0 ||
      b.x < 0 || b.x > W ||
      b.y < 0 || b.y > H;
    for (const e of enemies) {
      if (
        e.hp > 0 &&
        Math.hypot(e.x - b.x, e.y - b.y) < e.r + 7
      ) {
        e.hp -= b.damage;
        particleBurst(b.x, b.y, "#ffcf70", 6);
        remove = true;
        if (e.hp <= 0) {
          score += 100;
          scoreEl.textContent = score;
          particleBurst(e.x, e.y, e.color, 18);
        }
        break;
      }
    }
    if (remove) bullets.splice(i, 1);
  }
  enemies = enemies.filter(e => e.hp > 0);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.97;
    p.vy *= 0.97;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  if (player.hp <= 0) {
    running = false;
    overlay.style.display = "flex";
    document.querySelector("#overlay h1").textContent = "GAME OVER";
    document.querySelector("#overlay h2").textContent = "הקרב הסתיים";
    document.getElementById("hint").innerHTML =
      "הניקוד שלך: " + score +
      "<br>ניצחונות: " + wins +
      "<br><br>נסה שוב ושפר את התוצאה שלך.";
    document.getElementById("start").textContent = "שחק שוב";
  }
  while (score >= (wins + 1) * 500) {
    wins++;
    winsEl.textContent = wins;
    player.hp = Math.min(100, player.hp + 15);
    healthEl.style.width = player.hp + "%";
  }
}
function draw() {
  drawArena();
  for (const b of bullets) {
    ctx.fillStyle = "#ffe08a";
    ctx.shadowColor = "#ffb52e";
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(b.x, b.y, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  for (const e of enemies) {
    drawCharacter(e.x, e.y, e.r, e.color);
    ctx.fillStyle = "#351c25";
    ctx.fillRect(e.x - 18, e.y - 29, 36, 5);
    ctx.fillStyle = "#ff6262";
    ctx.fillRect(
      e.x - 18, e.y - 29,
      36 * Math.max(0, e.hp / 2), 5
    );
  }
  if (
    player.invulnerable <= 0 ||
    Math.floor(arenaTime / 4) % 2 === 0
  ) {
    drawCharacter(player.x, player.y, player.r, "#19a9ff", true);
  }
  for (const p of particles) {
    ctx.globalAlpha = Math.min(1, p.life / 20);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 4, 4);
  }
  ctx.globalAlpha = 1;
}
</script>
</body>
</html>
