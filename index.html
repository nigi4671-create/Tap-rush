<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tap Rush Arena 3D</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #101522;
  }
  #ui {
    position: fixed;
    top: 12px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    color: white;
    font-weight: bold;
    font-size: 17px;
    pointer-events: none;
    z-index: 2;
  }
  #help {
    position: fixed;
    bottom: 18px;
    left: 12px;
    right: 12px;
    text-align: center;
    color: white;
    background: #111a;
    padding: 10px;
    border-radius: 12px;
    font-size: 14px;
    pointer-events: none;
  }
  #controls {
    position: fixed;
    bottom: 85px;
    left: 18px;
    right: 18px;
    display: flex;
    justify-content: space-between;
    z-index: 3;
  }
  button {
    border: 2px solid white;
    border-radius: 16px;
    padding: 15px 20px;
    font-size: 18px;
    font-weight: bold;
    color: white;
    background: #2675d9;
    touch-action: manipulation;
  }
  #shoot { background: #e44747; }
  #restart {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    display: none;
    z-index: 5;
  }
</style>
</head>
<body>
<div id="ui">
  <span>❤️ חיים: <b id="hp">100</b></span>
  <span>⭐ ניקוד: <b id="score">0</b></span>
  <span>🪙 <b id="coins">0</b></span>
</div>
<div id="controls">
  <button id="move">⬅️ תנועה</button>
  <button id="shoot">🔫 ירי</button>
</div>
<div id="help">גרור את האצבע על המסך כדי להזיז את הגיבור. לחץ על ירי כדי לתקוף!</div>
<button id="restart">🔄 שחק שוב</button>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bd8ff);
scene.fog = new THREE.Fog(0x9bd8ff, 25, 65);
const camera = new THREE.PerspectiveCamera(
  60, innerWidth / innerHeight, 0.1, 100
);
camera.position.set(0, 11, 15);
camera.lookAt(0, 0, 0);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x536078, 2));
const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.position.set(5, 12, 7);
sun.castShadow = true;
scene.add(sun);
// רצפת הזירה
const floor = new THREE.Mesh(
  new THREE.BoxGeometry(26, 0.5, 26),
  new THREE.MeshStandardMaterial({color:0x48a95b, roughness:0.9})
);
floor.position.y = -0.3;
floor.receiveShadow = true;
scene.add(floor);
// סימוני רצפה
const grid = new THREE.GridHelper(26, 26, 0x226b39, 0x388b49);
grid.position.y = -0.04;
scene.add(grid);
// קירות הזירה
function wall(x,z,w,d) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w, 1.4, d),
    new THREE.MeshStandardMaterial({color:0x63768b})
  );
  m.position.set(x, 0.45, z);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
}
wall(0,-13,27,0.7);
wall(0,13,27,0.7);
wall(-13,0,0.7,27);
wall(13,0,0.7,27);
// יצירת דמות תלת־ממדית
function makeCharacter(color) {
  const group = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.55,0.68,1.05,12),
    new THREE.MeshStandardMaterial({color, roughness:0.45})
  );
  body.position.y = 0.8;
  body.castShadow = true;
  group.add(body);
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.48,16,12),
    new THREE.MeshStandardMaterial({color:0xffd1a0})
  );
  head.position.y = 1.65;
  head.castShadow = true;
  group.add(head);
  const eyeMaterial = new THREE.MeshStandardMaterial({color:0x17202d});
  for (const x of [-0.16,0.16]) {
    const eye = new THREE.Mesh(
      new THREE.SphereGeometry(0.055,8,8), eyeMaterial
    );
    eye.position.set(x,1.7,0.43);
    group.add(eye);
  }
  const gun = new THREE.Mesh(
    new THREE.BoxGeometry(0.22,0.22,0.85),
    new THREE.MeshStandardMaterial({color:0x26313d, metalness:0.5})
  );
  gun.position.set(0.55,1.05,0.55);
  gun.rotation.x = -0.12;
  group.add(gun);
  return group;
}
const player = makeCharacter(0x2675ff);
player.position.set(0,0,5);
scene.add(player);
let hp = 100;
let score = 0;
let coins = 0;
let gameOver = false;
let lastShot = 0;
let lastSpawn = 0;
let invulnerable = 0;
const enemies = [];
const bullets = [];
const coinObjects = [];
const hpEl = document.getElementById('hp');
const scoreEl = document.getElementById('score');
const coinsEl = document.getElementById('coins');
const restartBtn = document.getElementById('restart');
function spawnEnemy() {
  const enemy = makeCharacter(0xe94242);
  const side = Math.floor(Math.random()*4);
  if (side===0) enemy.position.set(-10,0,-10+Math.random()*20);
  if (side===1) enemy.position.set(10,0,-10+Math.random()*20);
  if (side===2) enemy.position.set(-10+Math.random()*20,0,-10);
  if (side===3) enemy.position.set(-10+Math.random()*20,0,10);
  enemy.userData.hp = 2;
  enemy.userData.speed = 1.1 + Math.random()*0.65;
  enemy.userData.hitTime = 0;
  scene.add(enemy);
  enemies.push(enemy);
}
function spawnCoin(position) {
  const coin = new THREE.Mesh(
    new THREE.CylinderGeometry(0.28,0.28,0.12,16),
    new THREE.MeshStandardMaterial({
      color:0xffd22f, metalness:0.65, roughness:0.25
    })
  );
  coin.rotation.x = Math.PI/2;
  coin.position.copy(position);
  coin.position.y = 0.45;
  coin.castShadow = true;
  scene.add(coin);
  coinObjects.push(coin);
}
function shoot() {
  if (gameOver || performance.now()-lastShot<260) return;
  lastShot = performance.now();
  let target = null;
  let best = Infinity;
  for (const enemy of enemies) {
    const distance = player.position.distanceTo(enemy.position);
    if (distance<best) {
      best=distance;
      target=enemy;
    }
  }
  if (!target || best>13) return;
  const bullet = new THREE.Mesh(
    new THREE.SphereGeometry(0.17,10,10),
    new THREE.MeshStandardMaterial({
      color:0xffe14a, emissive:0x664400
    })
  );
  bullet.position.set(
    player.position.x, 1.15, player.position.z
  );
  const direction = new THREE.Vector3(
    target.position.x-player.position.x,
    0.15,
    target.position.z-player.position.z
  ).normalize();
  bullet.userData.velocity = direction.multiplyScalar(0.55);
  bullet.userData.life = 35;
  scene.add(bullet);
  bullets.push(bullet);
  player.rotation.y = Math.atan2(
    target.position.x-player.position.x,
    target.position.z-player.position.z
  );
}
document.getElementById('shoot').addEventListener('pointerdown',shoot);
// תנועה עם מקלדת
const keys = {};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let moveDirection = 0;
document.getElementById('move').addEventListener('pointerdown',()=>{
  moveDirection=-1;
});
document.getElementById('move').addEventListener('pointerup',()=>{
  moveDirection=0;
});
document.getElementById('move').addEventListener('pointerleave',()=>{
  moveDirection=0;
});
// שליטה במגע: גרירת האצבע מזיזה את השחקן
let touchStart = null;
renderer.domElement.addEventListener('pointerdown',e=>{
  if (e.clientY > innerHeight-155) return;
  touchStart={x:e.clientX,y:e.clientY};
});
renderer.domElement.addEventListener('pointermove',e=>{
  if (!touchStart || gameOver) return;
  const dx=e.clientX-touchStart.x;
  const dy=e.clientY-touchStart.y;
  player.position.x += dx*0.025;
  player.position.z += dy*0.025;
  player.position.x=THREE.MathUtils.clamp(player.position.x,-11.5,11.5);
  player.position.z=THREE.MathUtils.clamp(player.position.z,-11.5,11.5);
  touchStart={x:e.clientX,y:e.clientY};
});
renderer.domElement.addEventListener('pointerup',()=>touchStart=null);
renderer.domElement.addEventListener('pointercancel',()=>touchStart=null);
function endGame() {
  gameOver=true;
  restartBtn.style.display='block';
}
restartBtn.addEventListener('click',()=>{
  for (const object of [...enemies,...bullets,...coinObjects]) {
    scene.remove(object);
  }
  enemies.length=0;
  bullets.length=0;
  coinObjects.length=0;
  hp=100;
  score=0;
  coins=0;
  gameOver=false;
  player.position.set(0,0,5);
  restartBtn.style.display='none';
  updateUI();
});
function updateUI() {
  hpEl.textContent=hp;
  scoreEl.textContent=score;
  coinsEl.textContent=coins;
}
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.04);
  const now=performance.now();
  if (!gameOver) {
    // תנועת מקלדת
    let dx=0,dz=0;
    if(keys['arrowleft']||keys['a']) dx-=1;
    if(keys['arrowright']||keys['d']) dx+=1;
    if(keys['arrowup']||keys['w']) dz-=1;
    if(keys['arrowdown']||keys['s']) dz+=1;
    if(dx||dz) {
      const length=Math.hypot(dx,dz);
      player.position.x+=dx/length*5*dt;
      player.position.z+=dz/length*5*dt;
    }
    player.position.x=THREE.MathUtils.clamp(player.position.x,-11.5,11.5);
    player.position.z=THREE.MathUtils.clamp(player.position.z,-11.5,11.5);
    if(now-lastSpawn>1700 && enemies.length<12) {
      spawnEnemy();
      lastSpawn=now;
    }
    // האויבים רודפים אחרי השחקן
    for(let i=enemies.length-1;i>=0;i--) {
      const enemy=enemies[i];
      const dir=new THREE.Vector3(
        player.position.x-enemy.position.x,
        0,
        player.position.z-enemy.position.z
      );
      const distance=dir.length();
      if(distance>1.15) {
        dir.normalize();
        enemy.position.addScaledVector(dir,enemy.userData.speed*dt);
        enemy.rotation.y=Math.atan2(dir.x,dir.z);
      } else if(now-enemy.userData.hitTime>650) {
        if(now>invulnerable) {
          hp=Math.max(0,hp-8);
          invulnerable=now+500;
          updateUI();
          if(hp<=0) endGame();
        }
        enemy.userData.hitTime=now;
      }
    }
    // תנועת קליעים ופגיעה באויבים
    for(let i=bullets.length-1;i>=0;i--) {
      const bullet=bullets[i];
      bullet.position.add(bullet.userData.velocity);
      bullet.userData.life--;
      let hit=false;
      for(let j=enemies.length-1;j>=0;j--) {
        const enemy=enemies[j];
        if(bullet.position.distanceTo(
          new THREE.Vector3(enemy.position.x,1.1,enemy.position.z)
        )<0.85) {
          enemy.userData.hp--;
          hit=true;
          if(enemy.userData.hp<=0) {
            spawnCoin(enemy.position);
            scene.remove(enemy);
            enemies.splice(j,1);
            score+=10;
            updateUI();
          }
          break;
        }
      }
      if(hit||bullet.userData.life<=0) {
        scene.remove(bullet);
        bullets.splice(i,1);
      }
    }
    // איסוף מטבעות
    for(let i=coinObjects.length-1;i>=0;i--) {
      const coin=coinObjects[i];
      coin.rotation.y+=dt*2;
      if(coin.position.distanceTo(player.position)<1.15) {
        scene.remove(coin);
        coinObjects.splice(i,1);
        coins++;
        score+=5;
        updateUI();
      }
    }
    // מצלמה עוקבת
    const desiredCamera=new THREE.Vector3(
      player.position.x,
      11,
      player.position.z+12
    );
    camera.position.lerp(desiredCamera,0.07);
    camera.lookAt(player.position.x,0,player.position.z);
  }
  renderer.render(scene,camera);
}
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
spawnEnemy();
spawnEnemy();
animate();
</script>
</body>
</html>
