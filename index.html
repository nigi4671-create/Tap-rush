<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>TAP RUSH ARENA</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #101a2b;
    font-family: Arial, sans-serif;
    color: white;
    touch-action: none;
}

#game {
    position: fixed;
    inset: 0;
}

canvas {
    display: block;
}

#hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
}

.top {
    position: absolute;
    top: max(12px, env(safe-area-inset-top));
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
}

.panel {
    padding: 9px 13px;
    border: 2px solid #607b9a;
    border-radius: 12px;
    background: linear-gradient(145deg, #304761, #111e31);
    box-shadow: 0 4px 0 #0a111c;
}

.logo {
    font-size: 17px;
    font-weight: 1000;
    font-style: italic;
    letter-spacing: 1px;
}

.logo span {
    color: #59edff;
}

.label {
    color: #b4cce5;
    font-size: 10px;
    font-weight: 900;
    margin-bottom: 4px;
}

.value {
    font-size: 19px;
    font-weight: 1000;
}

.stats {
    position: absolute;
    left: 13px;
    top: 82px;
    width: 175px;
}

.bar {
    height: 13px;
    background: #101725;
    border: 2px solid #a2bad0;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 10px;
}

.fill {
    height: 100%;
    width: 100%;
    transition: width .15s;
}

#hpFill {
    background: linear-gradient(90deg, #18c978, #a0ff6a);
}

#superFill {
    width: 0%;
    background: linear-gradient(90deg, #42e8ff, #b16bff);
}

#controls {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
}

#joystick {
    pointer-events: auto;
    position: absolute;
    left: max(22px, env(safe-area-inset-left));
    bottom: max(22px, env(safe-area-inset-bottom));
    width: 118px;
    height: 118px;
    border: 3px solid #c7e6ff88;
    border-radius: 50%;
    background: #10283caa;
    box-shadow: inset 0 0 20px #0008;
    touch-action: none;
}

#stick {
    position: absolute;
    width: 50px;
    height: 50px;
    left: 31px;
    top: 31px;
    border: 3px solid white;
    border-radius: 50%;
    background: linear-gradient(145deg, #b8f5ff, #398edc);
    box-shadow: 0 4px 0 #1a4774;
}

.action {
    pointer-events: auto;
    position: absolute;
    right: max(24px, env(safe-area-inset-right));
    bottom: max(28px, env(safe-area-inset-bottom));
    width: 78px;
    height: 78px;
    border: 3px solid white;
    border-radius: 50%;
    color: white;
    font-weight: 1000;
    background: radial-gradient(circle at 30% 25%, #ffcb73, #ed512e);
    box-shadow: 0 5px 0 #743020;
    touch-action: none;
}

#superButton {
    right: max(112px, calc(env(safe-area-inset-right) + 112px));
    bottom: max(24px, env(safe-area-inset-bottom));
    width: 65px;
    height: 65px;
    background: radial-gradient(circle at 30% 25%, #f4bdff, #8546eb);
    box-shadow: 0 5px 0 #472477;
    font-size: 11px;
    opacity: .65;
}

#superButton.ready {
    opacity: 1;
    box-shadow: 0 0 22px #dba5ff, 0 5px 0 #472477;
}

#message {
    position: absolute;
    top: 43%;
    width: 100%;
    text-align: center;
    font-size: 32px;
    font-weight: 1000;
    text-shadow: 0 4px 12px #000;
    opacity: 0;
}

#overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: radial-gradient(ellipse, #1a3859ed, #070d18fa);
}

.card {
    width: min(420px, 100%);
    padding: 27px 22px;
    text-align: center;
    border: 2px solid #5b8ab3;
    border-radius: 22px;
    background: linear-gradient(145deg, #2b4867, #101b2c);
    box-shadow: 0 15px 50px #0009;
}

.bigLogo {
    font-size: clamp(35px, 8vw, 52px);
    font-weight: 1000;
    font-style: italic;
    letter-spacing: -2px;
}

.bigLogo span {
    color: #59edff;
}

.subtitle {
    margin: 9px 0 23px;
    color: #bad0e8;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 4px;
}

#play {
    width: 100%;
    padding: 16px;
    border: 0;
    border-radius: 12px;
    background: linear-gradient(90deg, #5ceaff, #76ffb5);
    color: #102339;
    font-size: 18px;
    font-weight: 1000;
    box-shadow: 0 5px 0 #267c8d;
}

.help {
    margin-top: 18px;
    color: #c8d9e9;
    font-size: 13px;
    line-height: 1.9;
}

#rotate {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 30;
    align-items: center;
    justify-content: center;
    padding: 25px;
    background: #101a2b;
    text-align: center;
    font-weight: bold;
}

@media (orientation: portrait) and (max-width: 700px) {
    #rotate {
        display: flex;
    }
}

@media (max-height: 430px) {
    #joystick {
        width: 96px;
        height: 96px;
    }

    #stick {
        left: 21px;
        top: 21px;
    }

    .stats {
        top: 72px;
    }

    .action {
        width: 65px;
        height: 65px;
    }

    #superButton {
        width: 55px;
        height: 55px;
    }
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

}

<body>

<div id="game"></div>

<div id="hud">
    <div class="top">
        <div class="panel">
            <div class="logo">TAP <span>RUSH</span></div>
            <div class="label">ARENA COMBAT</div>
        </div>

        <div class="panel">
            <div class="label">SCORE</div>
            <div class="value" id="score">0</div>
        </div>

        <div class="panel">

    <div class="stats">

        <div class="bar"><div id="superFill" class="fill"></div></div>

    <div id="message"></div>
</div>

<div id="controls">
    <div id="joystick">
        <div id="stick"></div>
    </div>

    <button id="superButton" class="action">SUPER</button>
    <button id="fireButton" class="action">FIRE</button>
</div>

<div id="overlay">
    <div class="card">
        <div class="bigLogo">TAP <span>RUSH</span></div>
        <div class="subtitle">3D ARENA</div>

        <button id="play">PLAY NOW</button>

        <div class="help">
            תנועה — הג'ויסטיק בצד שמאל<br>
            ירי — הכפתור בצד ימין<br>
            כוח מיוחד — הכפתור הסגול<br><br>
            חיסל אויבים, צבור ניקוד ושרוד!
        </div>
    </div>
</div>

<div id="rotate">
    <div>
        <h2>TAP RUSH ARENA</h2>
        <p>סובב את האייפון לרוחב כדי לשחק.</p>
    </div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { clone } from 'three/addons/utils/SkeletonUtils.js';

const $ = id => document.getElementById(id);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8bd7ed);
scene.fog = new THREE.Fog(0x8bd7ed, 28, 62);

const camera = new THREE.PerspectiveCamera(
    43,
    innerWidth / innerHeight,
    0.1,
    100
);

camera.position.set(0, 22, 17);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: 'high-performance'
});

renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

$('game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xdff7ff, 0x49654a, 2.1));

const sunlight = new THREE.DirectionalLight(0xffffff, 3);
sunlight.position.set(-10, 18, 8);
sunlight.castShadow = true;
sunlight.shadow.mapSize.set(1024, 1024);
scene.add(sunlight);

const materials = {};

function material(name, color, roughness = 0.85, metalness = 0) {
    if (!materials[name]) {
        materials[name] = new THREE.MeshStandardMaterial({
            color,
            roughness,
            metalness
        });
    }
    return materials[name];
}

function block(parent, w, h, d, mat, x, y, z) {
    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        mat
    );

    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    parent.add(mesh);

    return mesh;
}

const arenaSize = 18;
const obstacles = [];

const floor = block(
    scene, 38, 0.5, 38,
    material('floor', 0x5bbd71),
    0, -0.35, 0
);

// Colorful tiled arena
for (let x = -17; x <= 17; x += 3.4) {
    for (let z = -17; z <= 17; z += 3.4) {
        const tile = block(
            scene,
            3.25, 0.025, 3.25,
            material(
                'tile' + ((Math.round(x + z) % 2 + 2) % 2),
                ((Math.round(x + z) % 2 + 2) % 2) ? 0x6ac77c : 0x62bf76
            ),
            x, -0.08, z
        );
    }
}

// Arena walls
const wallMaterial = material('walls', 0x4c7f9b);
const edgeMaterial = material('edge', 0x9af2ff, 0.4, 0.1);

block(scene, 36, 1.5, 0.8, wallMaterial, 0, 0.4, -18);
block(scene, 36, 1.5, 0.8, wallMaterial, 0, 0.4, 18);
block(scene, 0.8, 1.5, 36, wallMaterial, -18, 0.4, 0);
block(scene, 0.8, 1.5, 36, wallMaterial, 18, 0.4, 0);

block(scene, 36, 0.12, 0.15, edgeMaterial, 0, 1.15, -18);
block(scene, 36, 0.12, 0.15, edgeMaterial, 0, 1.15, 18);
block(scene, 0.15, 0.12, 36, edgeMaterial, -18, 1.15, 0);
block(scene, 0.15, 0.12, 36, edgeMaterial, 18, 1.15, 0);

// Obstacles
function addObstacle(x, z, w, d, color = 0x9dca75) {
    const group = new THREE.Group();
    group.position.set(x, 0, z);
    scene.add(group);

    block(
        group, w, 1.15, d,
        material('obstacle' + color, color),
        0, 0.48, 0
    );

    block(
        group, w + 0.1, 0.14, d + 0.1,
        edgeMaterial,
        0, 1.08, 0
    );

    obstacles.push({
        x, z,
        w: w + 0.55,
        d: d + 0.55
    });
}

addObstacle(-8, -7, 3, 2);
addObstacle(7, -7, 2, 3);
addObstacle(-8, 7, 2.5, 2.5);
addObstacle(8, 7, 3, 2);
addObstacle(0, -10, 3, 1.4, 0xd1b879);
addObstacle(0, 10, 3, 1.4, 0xd1b879);
addObstacle(-11, 0, 1.4, 3, 0xd1b879);
addObstacle(11, 0, 1.4, 3, 0xd1b879);

// Decorative trees and bushes
function addBush(x, z, scale = 1) {
    const group = new THREE.Group();
    group.position.set(x, 0, z);
    scene.add(group);

    const greens = [0x318b50, 0x3ca65b, 0x55b965];

    for (let i = 0; i < 5; i++) {
        const sphere = new THREE.Mesh(
            new THREE.SphereGeometry(0.45 * scale, 9, 7),
            material(
                'green' + greens[i % greens.length],
                greens[i % greens.length]
            )
        );

        sphere.position.set(
            (Math.random() - 0.5) * 0.9 * scale,
            0.3 * scale + Math.random() * 0.35 * scale,
            (Math.random() - 0.5) * 0.9 * scale
        );

        sphere.castShadow = true;
        group.add(sphere);
    }

    obstacles.push({
        x, z,
        w: 1.0 * scale,
        d: 1.0 * scale,
        bush: true
    });
}

[
    [-13, -12], [-11, -12], [-12, -13],
    [12, -12], [13, -12], [12, -13],
    [-13, 12], [-12, 13],
    [12, 12], [13, 13]
].forEach(p => addBush(p[0], p[1], 1.1));

// Character model loader
let characterTemplate = null;
let characterAnimations = [];
let modelReady = false;
let modelError = false;

const loader = new GLTFLoader();

loader.load(
    'https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb',
    gltf => {
        characterTemplate = gltf.scene;
        characterAnimations = gltf.animations;
        modelReady = true;

        // Replace the temporary player model with the 3D character.
        replaceCharacter(player, false);

        for (const enemy of enemies) {
            replaceCharacter(enemy, true);
        }
    },
    undefined,
    error => {
        console.warn('Character model could not load:', error);
        modelError = true;
    }
);

function createFallbackCharacter(isEnemy) {
    const group = new THREE.Group();

    const bodyColor = isEnemy ? 0xe84b63 : 0x1d9be8;
    const bodyMat = material(
        'fallback' + bodyColor,
        bodyColor
    );

    const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.42, 18, 14),
        bodyMat
    );

    head.position.y = 1.4;
    group.add(head);

    block(
        group, 0.8, 0.85, 0.5,
        bodyMat,
        0, 0.75, 0
    );

    block(
        group, 0.35, 0.25, 0.5,
        material('fallbackvisor', 0x172a44),
        0, 1.43, 0.35
    );

    for (const side of [-1, 1]) {
        block(
            group, 0.22, 0.65, 0.25,
            bodyMat,
            side * 0.53, 0.76, 0
        );

        block(
            group, 0.23, 0.45, 0.25,
            material('fallbacklegs', 0x27374b),
            side * 0.22, 0.22, 0
        );
    }

    scene.add(group);
    return group;
}

function makeCharacter(isEnemy) {
    const entity = {
        mesh: null,
        model: null,
        mixer: null,
        actions: {},
        currentAction: null,
        isEnemy,
        x: 0,
        z: 0,
        hp: 60,
        maxHp: 60,
        speed: 3,
        attackTimer: 0,
        invulnerable: 0,
        fireTimer: 0
    };

    entity.mesh = createFallbackCharacter(isEnemy);
    return entity;
}

function replaceCharacter(entity, isEnemy) {
    if (!characterTemplate) return;

    const old = entity.mesh;
    const root = new THREE.Group();

    const model = clone(characterTemplate);

    model.traverse(obj => {
        if (!obj.isMesh) return;

        obj.castShadow = true;
        obj.receiveShadow = true;

        if (obj.material) {
            if (Array.isArray(obj.material)) {
                obj.material = obj.material.map(m => m.clone());
            } else {
                obj.material = obj.material.clone();
            }

            const mats = Array.isArray(obj.material)
                ? obj.material
                : [obj.material];

            if (isEnemy) {
                for (const m of mats) {
                    if (m.color) {
                        m.color.setRGB(
                            Math.min(1, m.color.r * 1.25 + 0.1),
                            Math.max(0.12, m.color.g * 0.55),
                            Math.max(0.2, m.color.b * 0.65)
                        );
                    }
                }
            }
        }
    });

    const bounds = new THREE.Box3().setFromObject(model);
    const size = new THREE.Vector3();
    bounds.getSize(size);

    const scale = 1.65 / Math.max(size.y, 0.001);
    model.scale.setScalar(scale);

    model.position.y = -bounds.min.y * scale;

    root.add(model);
    root.position.set(entity.x, 0, entity.z);

    scene.add(root);
    scene.remove(old);

    entity.mesh = root;
    entity.model = model;
    entity.mixer = new THREE.AnimationMixer(model);
    entity.actions = {};

    for (const animation of characterAnimations) {
        entity.actions[animation.name] =
            entity.mixer.clipAction(animation);
    }

    playAnimation(entity, 'idle');
}

function playAnimation(entity, type) {
    if (!entity.mixer) return;

    const names = Object.keys(entity.actions);
    if (!names.length) return;

    const preferred = type === 'walk'
        ? ['Walking', 'Running', 'Walk', 'Run']
        : ['Idle', 'Standing', 'Breathing Idle'];

    let action = null;

    for (const wanted of preferred) {
        const found = names.find(n =>
            n.toLowerCase().includes(wanted.toLowerCase())
        );

        if (found) {
            action = entity.actions[found];
            break;
        }
    }

    if (!action) action = entity.actions[names[0]];

    if (entity.currentAction === action) return;

    if (entity.currentAction) {
        entity.currentAction.fadeOut(0.15);
    }

    entity.currentAction = action;
    action.reset().fadeIn(0.15).play();
}

// Player
const player = makeCharacter(false);
player.hp = 100;
player.maxHp = 100;
player.speed = 6.5;

let enemies = [];
let bullets = [];
let particles = [];

let score = 0;
let wave = 1;
let superCharge = 0;
let running = false;
let ended = false;
let spawnTimer = 1;
let messageTimer = 0;
let shooting = false;

let joyX = 0;
let joyY = 0;
let joyPointer = null;

const keys = {};

function blocked(x, z, radius = 0.4) {
    if (Math.abs(x) > arenaSize - 1 ||
        Math.abs(z) > arenaSize - 1) {
        return true;
    }

    for (const o of obstacles) {
        if (
            Math.abs(x - o.x) < o.w / 2 + radius &&
            Math.abs(z - o.z) < o.d / 2 + radius
        ) {
            return true;
        }
    }

    return false;
}

function moveEntity(entity, dx, dz, radius = 0.4) {
    const nx = entity.x + dx;
    const nz = entity.z + dz;

    if (!blocked(nx, entity.z, radius)) {
        entity.x = nx;
    }

    if (!blocked(entity.x, nz, radius)) {
        entity.z = nz;
    }

    entity.mesh.position.set(entity.x, 0, entity.z);
}

function updateHUD() {
    $('score').textContent = score;
    $('wave').textContent = wave;

    $('hpFill').style.width =
        Math.max(0, player.hp / player.maxHp * 100) + '%';

    $('hpText').textContent =
        Math.ceil(player.hp) + ' / ' + player.maxHp;

    $('superFill').style.width = superCharge + '%';
    $('superText').textContent = Math.floor(superCharge) + '%';

    $('superButton').classList.toggle(
        'ready',
        superCharge >= 100
    );
}

function showMessage(text, seconds = 1.2) {
    $('message').textContent = text;
    $('message').style.opacity = 1;
    messageTimer = seconds;
}

function burst(x, z, color = 0x8aefff, count = 12) {
    for (let i = 0; i < count; i++) {
        const mesh = new THREE.Mesh(
            new THREE.SphereGeometry(
                0.06 + Math.random() * 0.09,
                7, 7
            ),
            new THREE.MeshBasicMaterial({
                color,
                transparent: true
            })
        );

        mesh.position.set(
            x,
            0.5 + Math.random(),
            z
        );

        scene.add(mesh);

        particles.push({
            mesh,
            vx: (Math.random() - 0.5) * 7,
            vy: Math.random() * 4,
            vz: (Math.random() - 0.5) * 7,
            life: 0.4 + Math.random() * 0.4
        });
    }
}

function spawnEnemy() {
    if (enemies.length >= 13) return;

    let x = 0;
    let z = 0;

    for (let i = 0; i < 40; i++) {
        const edge = Math.floor(Math.random() * 4);
        const t = -15 + Math.random() * 30;

        if (edge === 0) {
            x = t;
            z = -16;
        } else if (edge === 1) {
            x = t;
            z = 16;
        } else if (edge === 2) {
            x = -16;
            z = t;
        } else {
            x = 16;
            z = t;
        }

        if (!blocked(x, z, 0.7)) break;
    }

    const enemy = makeCharacter(true);

    enemy.x = x;
    enemy.z = z;
    enemy.mesh.position.set(x, 0, z);
    enemy.hp = wave >= 3 ? 80 : 60;
    enemy.maxHp = enemy.hp;
    enemy.speed = 2.6 + Math.min(wave * 0.1, 1);

    enemies.push(enemy);
}

function shoot() {
    if (!running || ended || player.fireTimer > 0) return;

    player.fireTimer = 0.26;

    let target = null;
    let best = Infinity;

    for (const enemy of enemies) {
        const dx = enemy.x - player.x;
        const dz = enemy.z - player.z;
        const distance = dx * dx + dz * dz;

        if (distance < best) {
            best = distance;
            target = enemy;
        }
    }

    let dx = 0;
    let dz = 1;

    if (target) {
        dx = target.x - player.x;
        dz = target.z - player.z;
    } else if (Math.hypot(joyX, joyY) > 0.15) {
        dx = joyX;
        dz = joyY;
    }

    const length = Math.hypot(dx, dz) || 1;
    dx /= length;
    dz /= length;

    player.mesh.rotation.y = Math.atan2(dx, dz);

    const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.17, 12, 10),
        new THREE.MeshStandardMaterial({
            color: 0x6cf5ff,
            emissive: 0x19c8ff,
            emissiveIntensity: 2
        })
    );

    mesh.position.set(
        player.x + dx * 0.8,
        0.85,
        player.z + dz * 0.8
    );

    scene.add(mesh);

    bullets.push({
        mesh,
        x: mesh.position.x,
        z: mesh.position.z,
        dx,
        dz,
        speed: 18,
        damage: 35,
        life: 1.5
    });

    burst(
        mesh.position.x,
        mesh.position.z,
        0x72efff,
        3
    );
}

function useSuper() {
    if (!running || ended || superCharge < 100) return;

    superCharge = 0;
    showMessage('SUPER BLAST!', 1.3);

    burst(player.x, player.z, 0xc27aff, 40);

    for (const enemy of [...enemies]) {
        const dx = enemy.x - player.x;
        const dz = enemy.z - player.z;
        const distance = Math.hypot(dx, dz);

        if (distance < 7.5) {
            enemy.hp -= 110;

            if (distance > 0.01) {
                moveEntity(
                    enemy,
                    dx / distance * 1.2,
                    dz / distance * 1.2
                );
            }
        }
    }

    updateHUD();
}

function damagePlayer(amount) {
    if (player.invulnerable > 0 || ended) return;

    player.hp = Math.max(0, player.hp - amount);
    player.invulnerable = 0.45;

    burst(player.x, player.z, 0xff526d, 8);

    updateHUD();

    if (player.hp <= 0) endGame();
}

function removeEnemy(enemy) {
    const index = enemies.indexOf(enemy);
    if (index === -1) return;

    enemies.splice(index, 1);
    scene.remove(enemy.mesh);

    burst(enemy.x, enemy.z, 0xff627a, 18);

    score += 100;
    superCharge = Math.min(100, superCharge + 17);

    if (score >= wave * 500) {
        wave++;
        player.hp = Math.min(player.maxHp, player.hp + 15);
        showMessage('WAVE ' + wave, 1.5);
    }

    updateHUD();
}

function endGame() {
    running = false;
    ended = true;

    $('overlay').style.display = 'flex';
    $('overlay').querySelector('.bigLogo').innerHTML =
        'GAME <span>OVER</span>';

    $('overlay').querySelector('.subtitle').textContent =
        'FINAL SCORE: ' + score;

    $('play').textContent = 'PLAY AGAIN';
}

function startGame() {
    for (const enemy of enemies) scene.remove(enemy.mesh);
    for (const bullet of bullets) scene.remove(bullet.mesh);
    for (const p of particles) scene.remove(p.mesh);

    enemies = [];
    bullets = [];
    particles = [];

    player.x = 0;
    player.z = 0;
    player.hp = 100;
    player.fireTimer = 0;
    player.invulnerable = 0;
    player.mesh.position.set(0, 0, 0);

    score = 0;
    wave = 1;
    superCharge = 0;
    spawnTimer = 0.5;
    ended = false;
    running = true;

    $('overlay').style.display = 'none';
    $('overlay').querySelector('.bigLogo').innerHTML =
        'TAP <span>RUSH</span>';

    $('overlay').querySelector('.subtitle').textContent =
        '3D ARENA';

    $('play').textContent = 'PLAY NOW';

    showMessage('FIGHT!', 1);
    updateHUD();
}

$('play').addEventListener('click', startGame);

$('fireButton').addEventListener('pointerdown', e => {
    e.preventDefault();
    shooting = true;
    shoot();
});

$('fireButton').addEventListener('pointerup', () => {
    shooting = false;
});

$('fireButton').addEventListener('pointercancel', () => {
    shooting = false;
});

$('superButton').addEventListener('pointerdown', e => {
    e.preventDefault();
    useSuper();
});

// Joystick
const joystick = $('joystick');
const stick = $('stick');

function updateJoystick(e) {
    const rect = joystick.getBoundingClientRect();

    let dx = e.clientX - (rect.left + rect.width / 2);
    let dy = e.clientY - (rect.top + rect.height / 2);

    const max = rect.width * 0.31;
    const length = Math.hypot(dx, dy);

    if (length > max) {
        dx = dx / length * max;
        dy = dy / length * max;
    }

    joyX = dx / max;
    joyY = dy / max;

    stick.style.left =
        `calc(50% + ${dx}px - 25px)`;

    stick.style.top =
        `calc(50% + ${dy}px - 25px)`;
}

joystick.addEventListener('pointerdown', e => {
    e.preventDefault();

    joyPointer = e.pointerId;
    joystick.setPointerCapture(e.pointerId);

    updateJoystick(e);
});

joystick.addEventListener('pointermove', e => {
    if (e.pointerId === joyPointer) {
        updateJoystick(e);
    }
});

function releaseJoystick(e) {
    if (e.pointerId !== joyPointer) return;

    joyPointer = null;
    joyX = 0;
    joyY = 0;

    stick.style.left = '31px';
    stick.style.top = '31px';
}

joystick.addEventListener('pointerup', releaseJoystick);
joystick.addEventListener('pointercancel', releaseJoystick);

// Keyboard support
window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;

    if (e.code === 'Space') {
        e.preventDefault();
        shoot();
    }

    if (e.key.toLowerCase() === 'e') {
        useSuper();
    }
});

window.addEventListener('keyup', e => {
    keys[e.key.toLowerCase()] = false;
});

function update(dt) {
    if (messageTimer > 0) {
        messageTimer -= dt;

        if (messageTimer <= 0) {
            $('message').style.opacity = 0;
        }
    }

    if (!running || ended) return;

    player.fireTimer = Math.max(0, player.fireTimer - dt);
    player.invulnerable = Math.max(0, player.invulnerable - dt);

    let mx = joyX;
    let mz = joyY;

    if (keys['w'] || keys['arrowup']) mz = -1;
    if (keys['s'] || keys['arrowdown']) mz = 1;
    if (keys['a'] || keys['arrowleft']) mx = -1;
    if (keys['d'] || keys['arrowright']) mx = 1;

    const length = Math.hypot(mx, mz);

    if (length > 1) {
        mx /= length;
        mz /= length;
    }

    if (length > 0.08) {
        moveEntity(
            player,
            mx * player.speed * dt,
            mz * player.speed * dt
        );

        player.mesh.rotation.y = Math.atan2(mx, mz);
        playAnimation(player, 'walk');
    } else {
        playAnimation(player, 'idle');
    }

    if (shooting || keys[' ']) shoot();

    // Enemies chase and attack
    for (const enemy of [...enemies]) {
        const dx = player.x - enemy.x;
        const dz = player.z - enemy.z;
        const distance = Math.hypot(dx, dz);

        if (distance > 0.01) {
            enemy.mesh.rotation.y = Math.atan2(dx, dz);
        }

        if (distance > 1.5) {
            moveEntity(
                enemy,
                dx / distance * enemy.speed * dt,
                dz / distance * enemy.speed * dt
            );

            playAnimation(enemy, 'walk');
        } else {
            playAnimation(enemy, 'idle');

            enemy.attackTimer -= dt;

            if (enemy.attackTimer <= 0) {
                enemy.attackTimer = 0.9;
                damagePlayer(9);
            }
        }

        if (enemy.hp <= 0) {
            removeEnemy(enemy);
        }
    }

    spawnTimer -= dt;

    if (spawnTimer <= 0) {
        spawnEnemy();
        spawnTimer = Math.max(0.55, 1.5 - wave * 0.05);
    }

    // Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];

        b.x += b.dx * b.speed * dt;
        b.z += b.dz * b.speed * dt;
        b.life -= dt;

        b.mesh.position.set(b.x, 0.85, b.z);

        let remove =
            b.life <= 0 ||
            Math.abs(b.x) > arenaSize ||
            Math.abs(b.z) > arenaSize ||
            blocked(b.x, b.z, 0.1);

        if (!remove) {
            for (const enemy of enemies) {
                if (
                    Math.hypot(enemy.x - b.x, enemy.z - b.z) < 0.75
                ) {
                    enemy.hp -= b.damage;
                    burst(b.x, b.z, 0x78efff, 4);
                    remove = true;
                    break;
                }
            }
        }

        if (remove) {
            scene.remove(b.mesh);
            bullets.splice(i, 1);
        }
    }

    // Particle simulation
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];

        p.life -= dt;
        p.mesh.position.x += p.vx * dt;
        p.mesh.position.y += p.vy * dt;
        p.mesh.position.z += p.vz * dt;

        p.vy -= 9 * dt;

        if (p.life <= 0) {
            scene.remove(p.mesh);
            particles.splice(i, 1);
        }
    }

    // Update model animations
    if (player.mixer) player.mixer.update(dt);

    for (const enemy of enemies) {
        if (enemy.mixer) enemy.mixer.update(dt);
    }

    // Smooth overhead camera
    const desired = new THREE.Vector3(
        player.x,
        22,
        player.z + 16
    );

    camera.position.lerp(
        desired,
        1 - Math.pow(0.001, dt)
    );

    camera.lookAt(player.x, 0, player.z);

    player.mesh.visible =
        player.invulnerable <= 0 ||
        Math.floor(performance.now() / 80) % 2 === 0;

    updateHUD();
}

let lastTime = performance.now();

function animate(now) {
    requestAnimationFrame(animate);

    const dt = Math.min((now - lastTime) / 1000, 0.04);
    lastTime = now;

    update(dt);
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
});

updateHUD();
animate(performance.now());
</script>
