<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>TAP RUSH ARENA</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a1024;color:white;font-family:Arial;overflow:hidden}
button{border:0;border-radius:12px;padding:12px 16px;font-weight:bold;color:white;background:linear-gradient(135deg,#238cff,#824dff);cursor:pointer}
#game{position:fixed;inset:0}
canvas{display:block}
#hud{position:absolute;inset:0;pointer-events:none}
#top{display:flex;justify-content:space-between;padding:14px;font-weight:900;font-size:20px}
#brand{color:#48dcff;text-shadow:0 0 15px #48dcff}
#coins{color:#ffdb59;background:#101a35dd;padding:10px;border-radius:12px}
#stats{position:absolute;top:64px;left:50%;transform:translateX(-50%);text-align:center;font-weight:bold}
#health{width:180px;height:10px;background:#482c4b;border-radius:20px;overflow:hidden;margin-top:6px}
#hp{height:100%;width:100%;background:#45ef9a}
#timer{font-size:24px;margin-top:10px}
#score{margin-top:5px;background:#101a35dd;padding:7px;border-radius:9px}
#menus{position:absolute;top:62px;right:10px;display:flex;gap:6px;pointer-events:auto}
#controls{position:absolute;bottom:20px;left:15px;right:15px;display:none;justify-content:space-between;align-items:end;pointer-events:none}
#joy{width:110px;height:110px;border:2px solid #ffffff55;background:#ffffff16;border-radius:50%;position:relative;pointer-events:auto;touch-action:none}
#knob{position:absolute;left:30px;top:30px;width:46px;height:46px;border-radius:50%;background:#d9efffdd;border:2px solid white}
#fire{pointer-events:auto;touch-action:none;width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,#ff884c,#ff315d);border:3px solid #ffc2a6}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:#060b1bd9;pointer-events:auto}
.card{width:min(420px,100%);padding:25px;border-radius:24px;text-align:center;background:linear-gradient(150deg,#202e55,#10172c);border:1px solid #ffffff25;box-shadow:0 20px 70px #0009}
.logo{font-size:44px;font-weight:1000;letter-spacing:-2px}.logo span{color:#48dcff}
.muted{color:#b8c7e7;line-height:1.5}
.big{width:100%;margin-top:10px;padding:15px;font-size:17px}
#shop{display:none}
.shopCard{width:min(650px,100%);max-height:90dvh;overflow:auto;background:#121a32;border:1px solid #ffffff25;border-radius:20px;padding:16px}
.shopHead{display:flex;justify-content:space-between;align-items:center;gap:8px}
#skins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.skin{background:#ffffff0b;border:1px solid #ffffff22;border-radius:14px;padding:12px;text-align:center}
.skin.selected{border:2px solid #48dcff}
.preview{height:85px;display:flex;align-items:center;justify-content:center}
.orb{width:45px;height:48px;border-radius:40% 40% 30% 30%;background:var(--c);box-shadow:0 0 22px var(--c);position:relative}
.orb:before{content:"";position:absolute;width:29px;height:29px;border-radius:50%;background:var(--c);border:2px solid white;top:-17px;left:6px}
.orb:after{content:"••";position:absolute;top:-8px;left:10px;color:#10172c}
.skin h3{margin:5px}.rarity{font-size:11px;font-weight:bold;letter-spacing:1px}.desc{font-size:12px;color:#b8c7e7;min-height:30px;margin:8px 0}.skin button{width:100%;padding:10px 5px;font-size:12px}
#toast{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);background:#121b33;padding:14px 20px;border-radius:12px;display:none;font-weight:bold;white-space:nowrap}
@media(max-width:500px){#top{font-size:17px;padding:9px}#menus{top:55px;right:8px}#stats{top:60px}#controls{bottom:14px}#joy{width:100px;height:100px}#knob{left:25px;top:25px}#fire{width:70px;height:70px}}
</style>
</head>
<body>
<div id="game">
<div id="hud">
 <div id="top"><div id="brand">TAP RUSH</div><div id="coins">🪙 <span id="coinCount">500</span></div></div>
 <div id="stats">❤️ <span id="hpText">100</span><div id="health"><div id="hp"></div></div><div id="timer">01:00</div><div id="score">KOs: 0</div></div>
 <div id="menus"><button id="shopBtn">🛍️ חנות</button><button id="homeBtn">⌂</button></div>
 <div id="controls"><div id="joy"><div id="knob"></div></div><button id="fire">FIRE</button></div>
 <div id="toast"></div>
</div>
<div id="home" class="overlay">
 <div class="card">
  <div class="logo">TAP <span>RUSH</span></div><h3>ARENA</h3>
  <p class="muted">היכנס לזירה, הבס יריבים ופתח סקינים מיוחדים!</p>
  <p>⚔️ קרבות　 🪙 200 מטבעות למשחק　 💎 סקינים</p>
  <button class="big" id="play">▶ שחק עכשיו</button>
  <button class="big" id="homeShop">🛍️ חנות סקינים</button>
  <p class="muted" style="font-size:12px">מחשב: WASD או חצים לתנועה, רווח לירי.<br>אייפון: ג'ויסטיק וכפתור FIRE.</p>
 </div>
</div>
<div id="shop" class="overlay">
 <div class="shopCard">
  <div class="shopHead"><div><h2>SKIN LAB ✦</h2><p class="muted">בחר את המראה שלך</p></div><div style="color:#ffdb59">🪙 <span id="shopCoins">500</span></div><button id="closeShop">✕</button></div>
  <div id="skins"></div>
 </div>
</div>
<div id="end" class="overlay" style="display:none">
 <div class="card"><div style="font-size:50px">🏆</div><h1 id="endTitle">MATCH OVER</h1><p id="endMsg" class="muted"></p><h2 style="color:#ffdb59">🪙 +200 מטבעות</h2><button class="big" id="again">↻ שחק שוב</button><button class="big" id="endShop">🛍️ חנות</button></div>
</div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js';
const $=id=>document.getElementById(id);
const skinList=[
{id:'rookie',name:'ROOKIE',rarity:'STARTER',price:0,color:0x42d5ff,css:'#42d5ff',desc:'הלוחם המקורי'},
{id:'flame',name:'FLAME',rarity:'RARE',price:2500,color:0xff5038,css:'#ff5038',desc:'שריון לוהט ואש'},
{id:'volt',name:'VOLT',rarity:'EPIC',price:5000,color:0x39a8ff,css:'#39a8ff',desc:'כוח חשמלי כחול'},
{id:'shadow',name:'SHADOW',rarity:'EPIC',price:7500,color:0x9b59ff,css:'#9b59ff',desc:'לוחם צללים סגול'},
{id:'king',name:'KING',rarity:'LEGENDARY',price:10000,color:0xffc83d,css:'#ffc83d',desc:'שריון מלכותי מוזהב'},
{id:'diamond',name:'DIAMOND',rarity:'LEGENDARY',price:15000,color:0x72ffe2,css:'#72ffe2',desc:'שריון קריסטל נוצץ'}
];
let saveData={};try{saveData=JSON.parse(localStorage.getItem('tapRushSave')||'{}')}catch(e){}
let coins=Number.isFinite(saveData.coins)?saveData.coins:500;
let owned=Array.isArray(saveData.owned)?saveData.owned:['rookie'];
let equipped=skinList.some(s=>s.id===saveData.equipped)?saveData.equipped:'rookie';
if(!owned.includes('rookie'))owned.push('rookie');
function save(){try{localStorage.setItem('tapRushSave',JSON.stringify({coins,owned,equipped}))}catch(e){}}
function updateCoins(){$('coinCount').textContent=coins.toLocaleString();$('shopCoins').textContent=coins.toLocaleString()}
function rarityColor(s){return s.rarity==='RARE'?'#48bfff':s.rarity==='EPIC'?'#b58aff':s.rarity==='LEGENDARY'?'#ffd65a':'#b8c6df'}
function renderShop(){
 updateCoins();$('skins').innerHTML='';
 skinList.forEach(s=>{
  const have=owned.includes(s.id),active=equipped===s.id,el=document.createElement('div');
  el.className='skin'+(active?' selected':'');
  el.innerHTML=`<div class="preview"><div class="orb" style="--c:${s.css}"></div></div><div class="rarity" style="color:${rarityColor(s)}">${s.rarity}</div><h3>${s.name}</h3><div class="desc">${s.desc}</div><button ${active?'disabled':''}>${active?'✓ מצויד':have?'צייד סקין':'🪙 '+s.price.toLocaleString()}</button>`;
  el.querySelector('button').onclick=()=>{
   if(active)return;
   if(have){equipped=s.id;save();renderShop();replacePlayer();toast('הסקין צויד!')}
   else if(coins>=s.price){coins-=s.price;owned.push(s.id);equipped=s.id;save();renderShop();replacePlayer();toast('סקין חדש נפתח!')}
   else toast('אין מספיק מטבעות!');
  };
  $('skins').appendChild(el);
 });
}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.display='none',1400)}
updateCoins();renderShop();

const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b1022);scene.fog=new THREE.Fog(0x0b1022,25,50);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);camera.position.set(0,17,20);camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;$('game').prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xbad8ff,0x182038,2));
const light=new THREE.DirectionalLight(0xffffff,2.3);light.position.set(-5,12,8);light.castShadow=true;scene.add(light);
const arena=new THREE.Group();scene.add(arena);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(28,28),new THREE.MeshStandardMaterial({color:0x202c49,roughness:.9}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;arena.add(floor);
const grid=new THREE.GridHelper(28,28,0x405a83,0x2b3a5b);grid.position.y=.02;arena.add(grid);
function box(w,h,d,color,x,y,z,g=arena){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.5}));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;g.add(m);return m}
function ball(r,color,x,y,z,g){const m=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),new THREE.MeshStandardMaterial({color,roughness:.35,metalness:.1}));m.position.set(x,y,z);m.castShadow=true;g.add(m);return m}
function cyl(rt,rb,h,color,x,y,z,g){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,12),new THREE.MeshStandardMaterial({color,roughness:.5}));m.position.set(x,y,z);g.add(m);return m}
for(let i=-14;i<=14;i+=2){box(1.8,.6,.65,i%4?0x2f4269:0x425b88,i,.3,-14);box(1.8,.6,.65,i%4?0x2f4269:0x425b88,i,.3,14);box(.65,.6,1.8,i%4?0x2f4269:0x425b88,-14,.3,i);box(.65,.6,1.8,i%4?0x2f4269:0x425b88,14,.3,i)}
const obstacles=[];
function crate(x,z){const g=new THREE.Group();g.position.set(x,0,z);arena.add(g);box(1.35,.85,1.35,0x405a83,0,.43,0,g);box(1.42,.12,1.42,0x8aabd8,0,.88,0,g);obstacles.push({x,z,r:1.05})}
[[-5,-4],[5,-4],[-5,4],[5,4],[0,-7],[0,7]].forEach(p=>crate(...p));
function bush(x,z){const g=new THREE.Group();g.position.set(x,0,z);arena.add(g);cyl(.8,.9,.35,0x244f4c,0,.2,0,g);ball(.55,0x2f9a73,-.25,.6,0,g);ball(.57,0x38b982,.25,.65,0,g);ball(.42,0x49ce8b,0,.95,0,g)}
[[-8,0],[8,0],[-8,7],[8,-7],[-2,5],[2,-5]].forEach(p=>bush(...p));
function makeChar(id){
 const s=skinList.find(x=>x.id===id)||skinList[0],g=new THREE.Group();
 const mat=new THREE.MeshStandardMaterial({color:s.color,roughness:.35,metalness:.15});
 const dark=new THREE.MeshStandardMaterial({color:new THREE.Color(s.color).multiplyScalar(.5),roughness:.45});
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.46,.52,5,12),mat);body.position.y=.75;body.castShadow=true;g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.39,20,16),mat);head.position.y=1.48;head.castShadow=true;g.add(head);
 const face=new THREE.Group();face.position.set(0,1.48,.34);g.add(face);
 ball(.075,0xffffff,-.13,.02,0,face);ball(.075,0xffffff,.13,.02,0,face);ball(.035,0x10182b,-.13,.02,.06,face);ball(.035,0x10182b,.13,.02,.06,face);
 cyl(.46,.46,.14,new THREE.Color(s.color).multiplyScalar(.5),0,.48,0,g);
 const a=new THREE.Mesh(new THREE.CapsuleGeometry(.14,.32,4,8),dark);a.position.set(-.52,.8,0);a.rotation.z=-.25;g.add(a);
 const b=a.clone();b.position.x=.52;b.rotation.z=.25;g.add(b);
 const l=new THREE.Mesh(new THREE.CapsuleGeometry(.15,.32,4,8),dark);l.position.set(-.23,.23,0);g.add(l);
 const r=l.clone();r.position.x=.23;g.add(r);
 box(.2,.2,.65,0xe0efff,0,1.02,.55,g);
 if(id==='king'){cyl(.27,.35,.18,0xffd45a,0,1.88,0,g);for(let i=0;i<3;i++){const sp=new THREE.Mesh(new THREE.ConeGeometry(.1,.25,5),new THREE.MeshStandardMaterial({color:0xffe78c}));sp.position.set((i-1)*.18,2.08,0);g.add(sp)}}
 if(id==='diamond'){const cr=new THREE.Mesh(new THREE.OctahedronGeometry(.24),new THREE.MeshStandardMaterial({color:0xc1fff4,metalness:.6,roughness:.12,emissive:0x1a8f8b}));cr.position.y=1.98;g.add(cr)}
 if(id==='flame'){const f=new THREE.Mesh(new THREE.ConeGeometry(.23,.42,8),new THREE.MeshStandardMaterial({color:0xffa12e,emissive:0xff3700,emissiveIntensity:.6}));f.position.y=1.98;g.add(f)}
 if(id==='volt'){for(let i=0;i<2;i++){const v=new THREE.Mesh(new THREE.OctahedronGeometry(.14),new THREE.MeshStandardMaterial({color:0x9efcff,emissive:0x00aaff}));v.position.set(i?-.48:.48,1.2,.1);g.add(v)}}
 if(id==='shadow'){const h=new THREE.Mesh(new THREE.ConeGeometry(.48,.42,12),new THREE.MeshStandardMaterial({color:0x281447}));h.position.y=1.77;g.add(h)}
 g.userData={legs:[l,r],arms:[a,b]};return g;
}
let player=makeChar(equipped);player.position.set(0,0,9);arena.add(player);
function replacePlayer(){const p=player.position.clone(),rot=player.rotation.y;arena.remove(player);player=makeChar(equipped);player.position.copy(p);player.rotation.y=rot;arena.add(player)}
let enemies=[],bullets=[],particles=[],playing=false,ended=false,timeLeft=60,kos=0,health=100,shoot=false,lastShot=0,spawn=0,walk=0;
const keys={},clock=new THREE.Clock();
function spawnEnemy(){const side=Math.floor(Math.random()*4),v=12,x=side===0?-v:side===1?v:(Math.random()-.5)*20,z=side===2?-v:side===3?v:(Math.random()-.5)*20,g=makeChar('rookie');g.position.set(x,0,z);g.traverse(o=>{if(o.isMesh&&o.material?.color)o.material.color.setHex(0xff5278)});arena.add(g);enemies.push({g,hp:3,speed:1.3,hit:0})}
function particle(pos,color,n=8){for(let i=0;i<n;i++){const m=ball(.055,color,pos.x,.8+Math.random(),pos.z,arena);particles.push({m,life:.45,v:new THREE.Vector3((Math.random()-.5)*4,Math.random()*3,(Math.random()-.5)*4)})}}
function shootAt(e){const d=e.g.position.clone().sub(player.position);d.y=0;d.normalize();const m=ball(.14,skinList.find(s=>s.id===equipped).color,player.position.x,1.05,player.position.z,arena);m.position.x+=d.x*.8;m.position.z+=d.z*.8;bullets.push({m,d,life:1.6})}
function healthSet(v){health=Math.max(0,Math.min(100,v));$('hpText').textContent=Math.ceil(health);$('hp').style.width=health+'%'}
function clearBattle(){enemies.forEach(e=>arena.remove(e.g));enemies=[];bullets.forEach(b=>arena.remove(b.m));bullets=[];particles.forEach(p=>arena.remove(p.m));particles=[]}
function start(){clearBattle();player.position.set(0,0,9);player.rotation.set(0,0,0);timeLeft=60;kos=0;healthSet(100);ended=false;playing=true;spawn=0;lastShot=0;$('timer').textContent='01:00';$('score').textContent='KOs: 0';$('home').style.display='none';$('shop').style.display='none';$('end').style.display='none';$('controls').style.display='flex';for(let i=0;i<3;i++)spawnEnemy()}
function finish(){if(ended)return;ended=true;playing=false;$('controls').style.display='none';coins+=200;save();updateCoins();$('endTitle').textContent=kos>=5?'VICTORY!':'MATCH OVER';$('endMsg').textContent=`חיסלת ${kos} יריבים. קיבלת 200 מטבעות!`;$('end').style.display='flex'}
function move(dx,dz,dt){const n=Math.hypot(dx,dz);if(n<.05){player.position.y=0;return}dx/=Math.max(1,n);dz/=Math.max(1,n);const x=THREE.MathUtils.clamp(player.position.x+dx*5*dt,-12,12),z=THREE.MathUtils.clamp(player.position.z+dz*5*dt,-12,12);if(!obstacles.some(o=>Math.hypot(x-o.x,z-o.z)<o.r)){player.position.x=x;player.position.z=z}player.rotation.y=Math.atan2(dx,dz);walk+=dt*10;player.position.y=Math.abs(Math.sin(walk))*.04;player.userData.legs.forEach((l,i)=>l.rotation.x=Math.sin(walk+(i?Math.PI:0))*.4)}
function update(dt){
 if(!playing)return;timeLeft-=dt;$('timer').textContent=String(Math.floor(Math.max(0,timeLeft)/60)).padStart(2,'0')+':'+String(Math.ceil(Math.max(0,timeLeft)%60)).padStart(2,'0');
 if(timeLeft<=0||health<=0){finish();return}
 spawn-=dt;if(spawn<=0&&enemies.length<6){spawnEnemy();spawn=2.2}
 let target=null,dist=Infinity;for(const e of enemies){const d=player.position.distanceTo(e.g.position);if(d<dist){dist=d;target=e}}
 if(target&&dist<12&&(shoot||keys[' '])&&performance.now()-lastShot>330){shootAt(target);lastShot=performance.now()}
 for(const e of [...enemies]){const d=player.position.clone().sub(e.g.position);d.y=0;const n=d.length();if(n>1.3){d.normalize();e.g.position.addScaledVector(d,e.speed*dt);e.g.rotation.y=Math.atan2(d.x,d.z)}else{e.hit-=dt;if(e.hit<=0){healthSet(health-8);e.hit=.8}}}
 for(const b of [...bullets]){b.m.position.addScaledVector(b.d,13*dt);b.life-=dt;let hit=null;for(const e of enemies)if(b.m.position.distanceTo(new THREE.Vector3(e.g.position.x,1,e.g.position.z))<.8){hit=e;break}
 if(hit){hit.hp--;particle(hit.g.position,skinList.find(s=>s.id===equipped).color,5);arena.remove(b.m);bullets=bullets.filter(x=>x!==b);if(hit.hp<=0){particle(hit.g.position,0xffd65a,10);arena.remove(hit.g);enemies=enemies.filter(x=>x!==hit);kos++;$('score').textContent='KOs: '+kos}}
 else if(b.life<=0){arena.remove(b.m);bullets=bullets.filter(x=>x!==b)}}
 for(const p of [...particles]){p.life-=dt;p.m.position.addScaledVector(p.v,dt);p.v.y-=5*dt;if(p.life<=0){arena.remove(p.m);particles=particles.filter(x=>x!==p)}}
 camera.position.lerp(new THREE.Vector3(player.position.x,16,player.position.z+19),1-Math.pow(.001,dt));camera.lookAt(player.position.x,0,player.position.z)
}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);if(playing){let dx=0,dz=0;if(keys.w||keys.ArrowUp)dz--;if(keys.s||keys.ArrowDown)dz++;if(keys.a||keys.ArrowLeft)dx--;if(keys.d||keys.ArrowRight)dx++;dx+=joy.x;dz+=joy.y;move(dx,dz,dt);update(dt)}else{camera.position.lerp(new THREE.Vector3(0,17,20),.025);camera.lookAt(0,0,0)}renderer.render(scene,camera)}animate();
$('play').onclick=start;$('again').onclick=start;
function openShop(){renderShop();$('shop').style.display='flex'}
$('shopBtn').onclick=openShop;$('homeShop').onclick=openShop;$('closeShop').onclick=()=>$('shop').style.display='none';$('endShop').onclick=()=>{$('end').style.display='none';openShop()};
$('homeBtn').onclick=()=>{playing=false;$('controls').style.display='none';$('shop').style.display='none';$('end').style.display='none';$('home').style.display='flex'};
window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key.startsWith('Arrow')||e.key===' ')e.preventDefault()});window.addEventListener('keyup',e=>keys[e.key]=false);window.addEventListener('blur',()=>{Object.keys(keys).forEach(k=>keys[k]=false);shoot=false});
const joy={x:0,y:0},joystick=$('joy'),knob=$('knob');let pointer=null;
function joyMove(e){const r=joystick.getBoundingClientRect();let x=(e.clientX-r.left-r.width/2)/(r.width*.36),y=(e.clientY-r.top-r.height/2)/(r.height*.36),n=Math.hypot(x,y);if(n>1){x/=n;y/=n}joy.x=x;joy.y=y;knob.style.transform=`translate(${x*28}px,${y*28}px)`}
function joyReset(){pointer=null;joy.x=0;joy.y=0;knob.style.transform='translate(0,0)'}
joystick.onpointerdown=e=>{pointer=e.pointerId;joystick.setPointerCapture(e.pointerId);joyMove(e)};joystick.onpointermove=e=>{if(e.pointerId===pointer)joyMove(e)};joystick.onpointerup=joyReset;joystick.onpointercancel=joyReset;
$('fire').onpointerdown=e=>{shoot=true;$('fire').setPointerCapture(e.pointerId)};$('fire').onpointerup=()=>shoot=false;$('fire').onpointercancel=()=>shoot=false;
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
